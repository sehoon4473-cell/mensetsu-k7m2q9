<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面接トレーニング</title>
<style>
:root{
  --ink:#1f2a44; --muted:#667085; --paper:#f6f3ee; --card:#ffffff; --line:#e7e0d4;
  --indigo:#2f4a8a; --indigo-d:#22386c; --indigo-l:#e8edf8;
  --red:#c0392b; --red-l:#fde8e4; --green:#2b7a57; --green-l:#e2f3ea; --amber:#b9770e; --amber-l:#fdf0d8;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);color-scheme:light;
  font-family:"Noto Sans JP","Hiragino Sans","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{margin:0;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;
  padding:10px 18px;border-radius:999px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--indigo)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.primary:hover{background:var(--indigo-d)}
.btn.rec{background:var(--red);border-color:var(--red);color:#fff}
.btn.big{padding:14px 28px;font-size:17px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.badge.read{background:var(--indigo-l);color:var(--indigo)}
.badge.memo{background:var(--amber-l);color:var(--amber)}
.badge.ok{background:var(--green-l);color:var(--green)}
.badge.ng{background:var(--red-l);color:var(--red)}
.hero{background:linear-gradient(135deg,#22386c,#3a5aa5);color:#fff;border:none}
.hero .muted{color:#cfd9f2}
.hero h1{font-size:24px}
.dday{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 16px;text-align:center}
.dday b{font-size:26px;display:block;line-height:1.1}
.steps{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.step{aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;
  border:2px dashed var(--line);color:var(--muted);background:#fff;font-size:15px;max-width:64px;margin:0 auto;width:100%}
.step.done{border:2px solid var(--green);background:var(--green);color:#fff}
.step.now{border:2px solid var(--indigo);color:var(--indigo);box-shadow:0 0 0 4px var(--indigo-l)}
.step-lab{text-align:center;font-size:11px;margin-top:4px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--paper);border-radius:12px;padding:14px;text-align:center}
.stat b{font-size:24px;display:block}
.bar{height:8px;background:#ece7dd;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--indigo);transition:width .3s}
.qbox{border-left:5px solid var(--indigo);background:var(--indigo-l);border-radius:10px;padding:16px 18px}
.qbox .q{font-size:22px;font-weight:700}
.script{font-size:21px;line-height:2;padding:18px;border-radius:12px;background:#fffdf8;border:1px solid var(--line);letter-spacing:.02em}
.script.hidden{display:none}
.bad{background:var(--red-l);color:var(--red);border-bottom:2px solid var(--red);border-radius:3px;font-weight:700}
.live{min-height:56px;padding:12px 16px;border-radius:12px;background:#f2f4f8;color:#475467;font-size:17px;margin:12px 0}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.ring{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:conic-gradient(var(--c) calc(var(--p)*1%),#ece7dd 0)}
.ring span{width:74px;height:74px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.diff{list-style:none;padding:0;margin:8px 0}
.diff li{padding:8px 12px;border-radius:8px;background:var(--paper);margin-bottom:6px;font-size:16px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:8px}
.tag.miss{background:var(--red-l);color:var(--red)} .tag.sub{background:var(--amber-l);color:var(--amber)} .tag.extra{background:var(--indigo-l);color:var(--indigo)}
.chip{display:inline-block;background:var(--amber-l);color:var(--amber);padding:4px 12px;border-radius:99px;margin:3px;font-weight:700;font-size:14px}
.chip.miss{background:var(--red-l);color:var(--red)} .chip.hit{background:var(--green-l);color:var(--green)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;background:#fff}
summary{cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
textarea,input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
label{font-weight:700;display:block;margin:14px 0 6px}
.notice{background:var(--amber-l);color:#7a4b06;padding:12px 14px;border-radius:10px;font-size:14px}
.ok-box{background:var(--green-l);color:#1d5a40;padding:12px 14px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.celebrate{text-align:center;padding:32px 20px}
.celebrate h1{font-size:30px;margin:8px 0 12px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;letter-spacing:.12em;background:var(--paper);padding:8px 16px;border-radius:10px;display:inline-block}
pre.rep{white-space:pre-wrap;background:var(--paper);padding:14px;border-radius:10px;font-size:13px;max-height:340px;overflow:auto;font-family:inherit}
@media(max-width:560px){.qbox .q{font-size:19px}.script{font-size:18px}.hero h1{font-size:20px}.steps{gap:4px}.step{font-size:12px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";
const C = {"school": "리츠메이칸대학 デザイン・アート学部", "title": "모의면접 진행 순서 시트 — 선아연 학생", "info": "2027년도 외국인유학생입시(전기) · 2차 온라인 개인면접 · 10월 3일(토)", "greeting": "こんにちは。画面と音声は問題ありませんか。では、まず受験番号とお名前をお願いします。", "student": "선아연", "questions": [{"id": 1, "q": "自己紹介をお願いします。", "a": "はじめまして。韓国から参りました、ソン・アヨンと申します。私は日本で生まれて、8歳ごろまで日本で暮らしていました。韓国に移ってからは、子どもの頃は当たり前だった日本の文化を、少し離れたところから見るようになりました。その中で、伝統をどうやって次の世代につないでいけるのかに興味を持つようになりました。立命館大学では、着物の文様を中心に、伝統とデザインのつながりについて学びたいと思っています。本日はどうぞよろしくお願いいたします。", "type": "normal", "sum": "자기소개", "asum": "한국에서 온 송아연. 일본 출생·8세경까지 거주 → 한국에서 일본 문화를 거리 두고 보며 '전통을 어떻게 다음 세대로 이을까'에 관심 → 리츠메이칸에서 기모노 문양 중심으로 전통과 디자인의 연결을 배우고 싶음", "kw": ["アヨン", ["日本で生ま", "日本で生れ"], "8歳", "韓国", "伝統", "着物", "文様", "立命館"]}, {"id": 2, "q": "立命館大学デザイン・アート学部を志望した理由を教えてください。", "a": "伝統文化を、昔のまま残しておくだけではなくて、今の暮らしに合う形で次の世代に届ける方法を学びたいと思ったからです。デザイン・アート学部では、デザインや美術だけでなく、歴史や文化、それにデジタルの技術もいっしょに学ぶことができます。しかも、伝統文化がすぐそばにある京都という場所で学べるのは、私にとって一番の魅力です。", "type": "normal", "sum": "리츠메이칸 디자인·아트학부 지망 이유", "asum": "전통문화를 현재 삶에 맞게 다음 세대에 전하는 방법을 배우고 싶음. 디자인·미술에 역사·문화·디지털까지 함께 배울 수 있고, 전통이 가까운 교토에서 배우는 점이 매력", "kw": ["伝統文化", "今の暮らし", "次の世代", "歴史", "デジタル", "京都"]}, {"id": 3, "q": "志望理由書に、銀閣寺を再び訪れたとき「幼い頃の記憶と変わった様子」を目にしたとありますが、何が変わっていたんですか。", "a": "実は、建物そのものが大きく変わっていたわけではないと思います。変わっていたのは、私の見方のほうでした。子どもの頃は「古いお寺」くらいにしか思っていなかったんですが、久しぶりに行ってみると、庭と建物の配置や、全体の落ち着いた雰囲気がとても心に残りました。何百年も前のものが今もこうして残っていること自体が、すごいことだと感じたんです。そこから、こういうものをどうやって守って、伝えていくのかが気になるようになりました。", "type": "normal", "sum": "지망이유서의 긴카쿠지 재방문 — '어린 시절과 달라진 모습'이 무엇인가", "asum": "건물이 아니라 '내 시선'이 달라짐. 정원·건물 배치·차분한 분위기가 마음에 남았고 수백 년 전 것이 남아 있다는 점에 감동 → 지키고 전하는 방법이 궁금해짐", "kw": ["見方", "古いお寺", "庭", "配置", "雰囲気", "何百年"]}, {"id": 4, "q": "お寺の建築から、どうして着物や工芸にまで関心が広がったんですか。", "a": "銀閣寺について調べているうちに、日本の美意識は建物だけではなく、着る物や器、道具など、生活のいろいろなところに表れていると知りました。その中でも着物は、色や柄を見るだけで季節や時代の好みが伝わってくるのがおもしろいと思いました。建物は同じ場所に残り続けますが、着物や工芸は人が実際に身につけたり使ったりしてきたものなので、その時代の人の暮らしがもっと身近に感じられるところにひかれました。", "type": "normal", "sum": "사찰 건축에서 기모노·공예로 관심이 넓어진 이유", "asum": "일본의 미의식이 건물뿐 아니라 옷·그릇·도구 등 생활 전반에 나타남. 기모노는 색·무늬로 계절과 시대 취향이 전해지고 사람의 삶이 더 가깝게 느껴져 끌림", "kw": ["銀閣寺", "美意識", "着物", "季節", "暮らし", "身につけ"]}, {"id": 5, "q": "あなたにとって「伝統文化を受け継ぐ」とは、どういうことですか。", "a": "昔の形をそのまま守ることだけではないと考えています。時代が変われば、人の暮らし方も変わりますよね。ですから、大切な部分はしっかり残しながら、今の人が自然に触れられる形にしていくことも必要だと思います。今の若い人が「自分たちの文化だ」と感じられなければ、本当の意味では続いていかないのではないでしょうか。", "type": "normal", "sum": "'전통문화를 계승한다'는 것의 의미", "asum": "옛 형태를 그대로 지키는 것만이 아님. 중요한 부분은 남기고 지금 사람이 자연스럽게 접할 수 있는 형태로 바꿔야 '우리 문화'로 느끼고 이어짐", "kw": ["そのまま", "暮らし", "大切な部分", "自分たちの文化", "続いて"]}, {"id": 6, "q": "では、伝統の中で何を守って、何なら変えてもいいと思いますか。", "a": "正直に言うと、その答えはまだはっきり持っていません。それこそ大学で考えたいことです。今の時点では、その文化が生まれた背景や、そこに込められた意味は、きちんと理解して大事にするべきだと思っています。一方で、使い方や見せ方は、時代に合わせて変わってもいいのかなと思います。ただ、何が本質なのかを自分の感覚だけで決めてしまうのは危ないので、歴史や文化をしっかり学んだうえで判断できるようになりたいです。", "type": "normal", "sum": "전통에서 무엇을 지키고 무엇을 바꿔도 되는가", "asum": "아직 분명한 답은 없고 대학에서 고민할 과제. 탄생 배경·담긴 의미는 이해하고 소중히, 사용법·보여주는 방식은 시대에 맞게 변화 가능. 본질 판단은 역사·문화를 배운 뒤에", "kw": ["まだ", "大学で考え", "背景", "意味", "使い方", "学んだうえ"]}, {"id": 7, "q": "でも、伝統を現代風に変えてしまったら、もともとの意味が失われるのではありませんか。", "a": "はい、その可能性は十分あると思います。ですから、「新しくすること」自体を目的にしてはいけないと考えています。まずは、その伝統がどんな時代に、どんな人たちの暮らしの中で生まれたのかを知ることが先です。そのうえで、今の人にどう届けるかを考える。この順番を間違えないことが、一番大事だと思っています。", "type": "normal", "sum": "전통을 현대풍으로 바꾸면 원래 의미가 사라지지 않나(반론)", "asum": "가능성은 충분함. '새로움' 자체가 목적이면 안 됨. 먼저 어떤 시대·삶에서 생겼는지 알고, 그다음 지금 사람에게 어떻게 전할지 생각 — 이 순서가 가장 중요", "kw": ["可能性", "目的", "時代", "暮らし", "順番"]}, {"id": 8, "q": "デザインを学べる大学はほかにもありますが、なぜ立命館大学なんですか。", "a": "私は、新しい商品や見た目のきれいなものを作るだけのデザインを学びたいわけではないんです。伝統がどういう歴史や社会の中で生まれたのかを理解して、それを今の技術やデザインで次につなげたいと思っています。立命館大学のデザイン・アート学部は総合大学の中にあるので、歴史や文化、情報の分野まで幅広く学べます。それに、アート・リサーチセンターのように、日本の文化資料をデジタルで研究してきた場所があるのは、ほかの大学にはない強みだと思いました。", "type": "normal", "sum": "디자인 대학이 많은데 왜 리츠메이칸인가", "asum": "예쁜 상품만 만드는 디자인이 아니라 전통의 역사·사회적 배경을 이해해 지금의 기술·디자인으로 잇고 싶음. 종합대학이라 역사·문화·정보까지 폭넓게 배우고, 아트·리서치센터 같은 디지털 문화자료 연구 거점이 강점", "kw": ["見た目", "歴史", "総合大学", "アート・リサーチセンター", "デジタル", "強み"]}, {"id": 9, "q": "京都には美術大学もたくさんありますよね。作品を作る技術なら、美大のほうが学べるのではありませんか。", "a": "確かに、作品を作る技術をとことん磨くなら、美術大学のほうが向いているかもしれません。でも私がやりたいのは、自分の作品を作ることよりも、伝統的なデザインを調べて、その意味を理解したうえで今の暮らしにつなげることなんです。そのためには、歴史や文化を研究する力と、資料を分析する力の両方が必要です。デザインとアートを、研究と実践の両方から学べる立命館大学が、私には一番合っていると考えました。", "type": "normal", "sum": "교토 미술대학도 많은데 제작 기술은 미대가 낫지 않나(반론)", "asum": "기술 연마는 미대가 맞을 수 있으나 자신은 작품 제작보다 전통 디자인을 조사해 의미를 이해하고 현재 삶에 연결하고 싶음. 연구력·분석력과 실천을 모두 배울 수 있는 리츠메이칸이 적합", "kw": ["美術大学", "作品", "研究", "分析", "両方", "立命館"]}, {"id": 10, "q": "入学したら、どんなことを勉強したいですか。", "a": "まずは「工芸・産業史」や「視覚文化・芸術史」などの授業で、日本の工芸や、目で見る文化がどんな歴史の中で生まれて、どう変わってきたのかという基礎を学びたいです。そのうえで、デジタルの技術を使って昔の資料を分析する方法も身につけたいと思っています。最終的には、歴史の知識とデジタルの技術、そしてデザインを組み合わせて、伝統を今の形で受け継ぐ方法を研究したいです。", "type": "normal", "sum": "입학 후 공부하고 싶은 것", "asum": "'공예·산업사', '시각문화·예술사' 수업으로 역사적 기초를 배우고, 디지털 기술로 옛 자료를 분석하는 방법을 익힘 → 역사+디지털+디자인으로 전통 계승 방법을 연구", "kw": ["工芸・産業史", "視覚文化", "芸術史", "デジタル", "資料", "組み合わせ"]}, {"id": 11, "q": "なぜ着物や伝統文様に興味があるんですか。", "a": "着物はただの服ではなくて、色や柄、素材から、その時代の人の好みや暮らしが見えてくるところがおもしろいと思っています。たとえば同じ花の柄でも、時代によって描き方や組み合わせ方が違っていたりします。いろいろな時代の着物を並べて比べれば、日本人の美意識がどう移り変わってきたのかが見えてくるのではないかと思い、着物の文様を「デザインの資料」として研究してみたいと考えるようになりました。", "type": "normal", "sum": "기모노·전통 문양에 관심 갖게 된 이유", "asum": "기모노는 색·무늬·소재에서 시대의 취향과 삶이 보임. 같은 꽃무늬도 시대별로 표현이 다름 → 여러 시대를 비교하면 미의식의 변천이 보여 문양을 '디자인 자료'로 연구하고 싶음", "kw": ["着物", ["色", "文様"], "時代", "並べ", "美意識", "資料"]}, {"id": 12, "q": "特に関心のある文様や技法はありますか。", "a": "友禅染に一番関心があります。最初は、梅や草花がまるで絵のように描かれていて、本当にきれいだなと思ったのがきっかけでした。でも調べてみると、同じ友禅でも、京都の京友禅と金沢の加賀友禅では、色の使い方や表現の仕方がかなり違うと知りました。大学では、こうした文様が時代によってどう描かれ、どう使われ方が変わってきたのかを、資料を通して比べてみたいです。", "type": "normal", "sum": "특히 관심 있는 문양·기법", "asum": "유젠(友禅)염. 매화·초화가 그림처럼 그려진 것이 계기. 교유젠과 가가유젠은 색·표현이 크게 다르다는 걸 알게 됨 → 시대별 문양 표현·쓰임의 변화를 자료로 비교하고 싶음", "kw": ["友禅", ["梅", "草花"], "京友禅", "加賀友禅", "色", "比べ"]}, {"id": 13, "q": "京友禅と加賀友禅は、具体的にどう違うんですか。", "a": "私が調べた範囲ですが、京友禅は金箔や刺しゅうを加えることも多くて、華やかで上品な印象があります。それに対して加賀友禅は、「加賀五彩」と呼ばれる落ち着いた色を中心に、草花を写実的に描くのが特徴で、葉っぱに虫食いの跡まで描くこともあるそうです。同じ友禅でも、土地によってここまで違うのかと驚きました。", "type": "normal", "sum": "교유젠과 가가유젠의 구체적 차이", "asum": "교유젠: 금박·자수를 더하는 경우가 많아 화려하고 품위 있는 인상. 가가유젠: '가가고채'라는 차분한 색 중심, 초화를 사실적으로 표현(벌레 먹은 잎까지 그리기도)", "kw": ["京友禅", ["金箔", "刺しゅう", "刺繍"], "華やか", "加賀友禅", "加賀五彩", "写実", "虫食い"]}, {"id": 14, "q": "アート・リサーチセンターで、どんなことをしてみたいですか。", "a": "アート・リサーチセンターには、着物や織物、図案などの資料がデジタルで残されていると知りました。最近では、帯の図案をデジタル化する共同研究も始まったと聞いています。そういう資料を使って、文様が時代ごとにどう変わってきたのかを比べてみたいです。一枚ずつ見ているだけでは気づけない共通点や変化も、たくさんの資料を並べることで見えてくると思うので、それを歴史の背景と合わせて考えてみたいです。", "type": "normal", "sum": "아트·리서치센터에서 해보고 싶은 것", "asum": "기모노·직물·도안 자료가 디지털로 보존돼 있음(오비 도안 디지털화 공동연구도 시작). 문양이 시대별로 어떻게 변했는지 비교하고, 여러 자료를 나란히 놓아야 보이는 공통점·변화를 역사적 배경과 함께 고찰", "kw": ["アート・リサーチセンター", "資料", "デジタル", "帯", "図案", "時代", "比べ"]}, {"id": 15, "q": "デジタルアーカイブというのは、結局、資料を保存しておくだけのものではないですか。", "a": "保存ももちろん大切な役割ですが、それだけではないと思います。デジタルになると、違う時代の資料を並べて比べたり、特徴で検索したりするのがずっと簡単になります。それに、実物を見に行けない人でも、世界中から資料にアクセスできます。研究や新しいデザインに使われることで、アーカイブは過去を残すだけでなく、過去と今をつなぐものになると考えています。", "type": "normal", "sum": "디지털 아카이브는 결국 자료 보존일 뿐 아닌가(반론)", "asum": "보존도 중요하지만 그것만이 아님. 시대가 다른 자료를 나란히 비교·특징 검색이 쉬워지고 실물을 못 보는 사람도 세계 어디서나 접근 가능. 연구·디자인에 쓰이면 과거와 현재를 잇는 것이 됨", "kw": ["保存", "比べ", "検索", ["世界中", "アクセス"], "過去と今", "つなぐ"]}, {"id": 16, "q": "AIを伝統文化の研究に、どう活用したいと考えていますか。", "a": "たくさんの着物や織物の資料から、色や柄、形の特徴をAIに比べてもらえば、人が一枚ずつ見ていては気づきにくい変化や共通点が見つけやすくなると思います。たとえば、ある文様が時代によってどう変わったのかをAIで整理して、その結果を歴史や文化の背景と合わせて考えてみたいです。ただ、AIは「変化があった」ことは教えてくれても、「なぜ変わったのか」までは説明してくれません。そこを考えるのは人の役目だと思っています。", "type": "normal", "sum": "AI를 전통문화 연구에 어떻게 활용할지", "asum": "많은 자료의 색·무늬·형태 특징을 AI로 비교하면 사람이 놓치기 쉬운 변화·공통점을 찾기 쉬움. 다만 AI는 '변했다'는 알려줘도 '왜 변했는가'는 설명 못 함 — 그 고찰은 사람의 몫", "kw": [["AI", "エーアイ"], ["比べ", "特徴"], "変化", "共通点", "なぜ変わった", "人"]}, {"id": 17, "q": "AIがもっと発達したら、デザイナーはいらなくなるのではありませんか。", "a": "私は、AIがデザイナーの代わりになるというより、デザイナーが考えられる幅を広げてくれる道具になると思っています。AIはたくさんの資料からパターンを見つけるのは得意ですが、それがなぜ生まれたのか、どんな意味があるのか、今の社会でどう使えばいいのかを判断するのは、やはり人だと思います。特に伝統文化を扱うデザインでは、形だけでなく背景を理解することが欠かせないので、人の役割はなくならないと考えています。", "type": "normal", "sum": "AI가 발전하면 디자이너는 필요 없지 않나(반론)", "asum": "AI는 대체재가 아니라 생각의 폭을 넓혀 주는 도구. 패턴 발견은 잘하지만 왜 생겼고 어떤 의미이며 지금 사회에서 어떻게 쓸지는 사람이 판단. 전통문화 디자인은 배경 이해가 필수라 사람의 역할은 사라지지 않음", "kw": ["道具", "幅", "パターン", ["なぜ", "意味"], "判断", "人"]}, {"id": 18, "q": "では、AIが作った伝統文様は「伝統文化」と言えると思いますか。", "a": "すぐに「伝統文化」とは言えないと思います。伝統文化は形だけでできているのではなく、それを作って使ってきた人たちの歴史や暮らし、思いが積み重なったものだからです。ただ、AIが伝統を理解したり、新しく生かしたりするための手助けになることはあると思います。大切なのは、AIを使うかどうかより、どれだけ理解したうえで使うかではないでしょうか。", "type": "normal", "sum": "AI가 만든 전통 문양도 '전통문화'라 할 수 있나", "asum": "바로 '전통문화'라고는 못 함. 전통은 형태뿐 아니라 만들고 써온 사람들의 역사·삶·마음이 쌓인 것. 다만 AI가 이해·활용을 돕는 역할은 가능. 중요한 건 AI 사용 여부보다 얼마나 이해하고 쓰느냐", "kw": ["言えない", "歴史", "暮らし", "思い", "手助け", "理解したうえ"]}, {"id": 19, "q": "あなたにとって、デザインとは何ですか。", "a": "私にとってデザインは、見た目をきれいにすることだけではなく、「つなぐこと」です。人と物、それから過去と今をつなぐことだと考えています。昔のものをそのまま残しておくだけだと、今の人にはその良さがなかなか伝わらないこともあります。だからこそ、伝統の意味を理解したうえで、今の人が新しく体験できる形にしていくのも、デザインの大事な役割だと思っています。", "type": "normal", "sum": "당신에게 디자인이란", "asum": "겉모습을 예쁘게 하는 것이 아니라 '잇는 것' — 사람과 물건, 과거와 현재. 전통의 의미를 이해한 뒤 지금 사람이 새롭게 경험할 수 있는 형태로 만드는 것이 디자인의 역할", "kw": ["つなぐ", "人と物", "過去と今", "見た目", "意味", "新しく体験"]}, {"id": 20, "q": "最近、気になっているデザインや作品はありますか。", "a": "インスタグラムで、京都・西陣の「西陣 岡本」という織物の工房をよく見ています。京都で有名なものを探していたときに偶然見つけて、フォローするようになりました。最初は金色の華やかな色や柄に目が行ったんですが、見ているうちに、もともとお寺や神社で使われてきた金襴という織物が、今は建物の内装やアート作品にも使われていると知って、とてもおもしろいと思いました。技術は守りながら、使い方は今に合わせて変えている。私がずっと考えてきた「何を守って、何を変えるか」の一つの答えを見たような気がしました。", "type": "normal", "sum": "최근 눈여겨보는 디자인·작품", "asum": "인스타그램에서 교토 니시진 직물 공방 '니시진 오카모토'를 즐겨 봄. 사찰·신사용이던 금란이 건물 내장·예술작품에도 쓰이는 것에 흥미 → 기술은 지키고 쓰임은 현재에 맞게 바꾸는 점이 '무엇을 지키고 바꿀까'의 한 답으로 보임", "kw": [["西陣岡本", "西陣"], ["インスタ", "Instagram"], "金襴", ["内装", "アート"], "技術", "守って", "変えて"]}, {"id": 21, "q": "西陣織とは、どんな織物ですか。簡単に説明してください。", "a": "京都の西陣という地域で作られている織物で、先に色を染めた糸を使って、模様を織り出していくのが特徴です。着物の帯などで特に有名です。西陣岡本さんが作っている金襴は、金や銀の箔を使った糸で織る、とても豪華な織物で、昔からお寺や神社を飾るのに使われてきたそうです。", "type": "normal", "sum": "니시진오리가 어떤 직물인지 간단히 설명", "asum": "교토 니시진 지역의 직물. 먼저 염색한 실로 무늬를 짜냄. 오비로 특히 유명. 오카모토의 금란은 금·은박 실로 짜는 호화로운 직물로 예부터 사찰·신사 장식에 사용", "kw": ["西陣", ["先に染め", "染めた糸"], "帯", "金襴", ["金や銀", "箔"], ["お寺", "神社"]]}, {"id": 22, "q": "本学で、特に授業を受けてみたい先生や、学んでみたい分野はありますか。", "a": "前﨑信也先生のご専門が、京都の芸術や工芸の文化史、そしてデジタルアーカイブだと知って、ぜひ授業を受けてみたいと思いました。京都の工芸を、歴史とデジタルの両方から研究されているところが、私のやりたいことにとても近いと感じています。", "type": "normal", "sum": "본 학부에서 수업 듣고 싶은 교수·분야", "asum": "마에자키 신야 교수의 전문이 교토 예술·공예 문화사와 디지털 아카이브라고 알게 되어 수업 희망. 교토 공예를 역사와 디지털 양면에서 연구하는 점이 자신의 목표와 가까움", "kw": [["前﨑", "前崎", "まえざき"], "工芸", ["文化史", "京都"], "デジタルアーカイブ", "授業"]}, {"id": 23, "q": "将来は、どんなデザイナーになりたいですか。", "a": "日本の伝統的な美意識や文化の意味をきちんと理解したうえで、それを今の感覚と結びつけられるデザイナーになりたいです。たとえば伝統文様を、ただ商品に柄として貼りつけるのではなく、「なぜこの柄が生まれたのか」「どんな意味があるのか」を知ったうえで、今の人が自然に使いたくなる形で提案したいと思っています。伝統が昔話で終わらずに、次の世代の暮らしの中にも残っていく、そのお手伝いをするのが目標です。", "type": "normal", "sum": "장래 어떤 디자이너가 되고 싶은가", "asum": "전통의 의미를 이해하고 현재 감각과 연결하는 디자이너. 문양을 단순히 상품에 붙이지 않고 '왜 생겼는지·의미'를 알고 지금 사람이 쓰고 싶어지는 형태로 제안 → 전통이 옛이야기로 끝나지 않고 다음 세대 삶에 남도록 돕는 것이 목표", "kw": ["美意識", "今の感覚", "柄", "なぜ", "意味", "次の世代"]}, {"id": 24, "q": "伝統とデザインを結びつける仕事というのは、具体的にどんな就職先を考えていますか。", "a": "まだ一つに決めているわけではありませんが、たとえば着物や織物のメーカーで、伝統の技術を生かした新しい商品を企画する仕事に興味があります。美術館や博物館で、文化資料のデジタル化や展示に関わる仕事にもひかれます。最近は西陣岡本さんのように、伝統の工房が海外や別の分野とコラボすることも増えているので、日本と韓国の両方を知っている私の経験が生かせる場面もあると思っています。", "type": "normal", "sum": "전통과 디자인을 잇는 일 — 구체적 취업처", "asum": "한 곳으로 정하진 않았지만 기모노·직물 제조사에서 전통 기술을 살린 신상품 기획, 미술관·박물관의 문화자료 디지털화·전시에 관심. 공방의 해외·타분야 협업이 늘어 한일 양쪽을 아는 경험이 살 수 있다고 봄", "kw": [["メーカー", "着物", "織物"], ["商品", "企画"], ["美術館", "博物館"], ["デジタル化", "展示"], ["西陣岡本", "コラボ"], "日本と韓国"]}, {"id": 25, "q": "なぜ日本で学ぶ必要があるんですか。", "a": "私が研究したいのが日本の伝統文化、特に着物や工芸だからです。日本にいれば、実物の資料や博物館、お寺、工房などに直接足を運べますし、今の日本の人たちが伝統をどう受け止めているのかも、自分の目で確かめることができます。それに私は、日本で育ったあと韓国に移ったので、身近だった日本の文化を少し外から見る目を持っていると思います。その視点も、日本での学びに生かしたいです。", "type": "normal", "sum": "왜 일본에서 배워야 하는가", "asum": "연구하고 싶은 것이 일본 전통문화(기모노·공예)이기 때문. 실물 자료·박물관·사찰·공방을 직접 방문하고 현재 일본인이 전통을 어떻게 받아들이는지 확인 가능. 일본에서 자란 뒤 한국으로 이주해 바깥에서 보는 시선도 있음", "kw": ["日本の伝統文化", ["実物", "資料"], ["博物館", "お寺", "工房"], "自分の目", "韓国に移", ["外から", "視点"]]}, {"id": 26, "q": "日本文化の研究なら、韓国の大学でもできるのではありませんか。", "a": "資料を読んで研究することは、韓国でもできると思います。でも私は、伝統が今の日本社会の中でどう守られ、どう使われているのかまで、実際に見て確かめたいんです。実物の着物や織物を見て、それをデジタルの資料と比べながら研究できるのは、やはり日本、特に京都ならではだと思います。", "type": "normal", "sum": "일본문화 연구는 한국 대학에서도 가능하지 않나(반론)", "asum": "자료를 읽는 연구는 한국에서도 가능하나, 전통이 현재 일본 사회에서 어떻게 지켜지고 쓰이는지 직접 보고 싶음. 실물 기모노·직물을 보며 디지털 자료와 비교 연구하는 것은 일본, 특히 교토만의 환경", "kw": [["韓国でもできる", "読んで研究", "資料を読"], "今の日本社会", "実際に見", "実物", "デジタル", "京都"]}, {"id": 27, "q": "韓国と日本の伝統文化には、どんな違いがあると思いますか。", "a": "どちらか一方を「こうだ」と決めつけるのは、あまりしたくないと思っています。私が関心を持っているのは、伝統が今の生活の中でどう見せられて、どう使われているかという点です。これからは特に、服や工芸のような分野に絞って、両国で昔の形がそのまま残っている部分と、今の生活に合わせて変わってきた部分を、実際の例で比べてみたいです。", "type": "normal", "sum": "한국과 일본 전통문화의 차이", "asum": "어느 쪽이 '이렇다'고 단정하고 싶지 않음. 관심은 전통이 지금 생활에서 어떻게 보여지고 쓰이는가. 의복·공예에 한정해 양국의 옛 형태가 남은 부분과 현대에 맞게 변한 부분을 실제 사례로 비교하고 싶음", "kw": ["決めつけ", "今の生活", ["服", "工芸"], "両国", "比べ", "昔の形"]}, {"id": 28, "q": "たとえば韓服と着物を比べると、どうですか。", "a": "私が一番感じるのは、形の違いです。着物はまっすぐな布を組み合わせて作って、帯でしめて着ますが、韓服はチョゴリの袖や、ふんわり広がるチマのように、やわらかい曲線がきれいだと思います。それから、最近の韓国では「生活韓服」といって、普段着として着やすくアレンジした韓服も人気があります。伝統を今の暮らしに合わせるという点で、日本の着物のリメイクなどとも比べてみたいです。", "type": "normal", "sum": "한복과 기모노를 비교하면", "asum": "형태 차이: 기모노는 직선 천을 이어 만들고 오비로 묶음, 한복은 저고리 소매·치마의 부드러운 곡선이 아름다움. 최근 한국의 '생활한복'이 인기 → 전통을 현재 삶에 맞춘다는 점에서 일본 기모노 리메이크와도 비교하고 싶음", "kw": ["形", "着物", "帯", "韓服", ["チョゴリ", "チマ"], "曲線", "生活韓服", "リメイク"]}, {"id": 29, "q": "日本語の勉強で、一番大変だったことは何ですか。", "a": "小さい頃に日本で暮らしていたので、日常会話にはそれほど困りませんでした。でも、大学で勉強するのに必要な漢字や、かたい文章の言葉には苦労しました。単語を覚えるときや記述問題を書くときに力不足を感じたので、毎朝授業の前に30分、漢字を書いて覚える練習を続けてきました。入学してからも、専門的な内容を正しく理解して、きちんと表現できるように、日本語をもっと磨いていきたいです。", "type": "normal", "sum": "일본어 공부에서 가장 힘들었던 점", "asum": "어릴 때 일본 거주로 일상회화는 문제없었으나 대학 공부용 한자·딱딱한 문장 어휘가 어려웠음. 매일 수업 전 30분 한자 쓰기를 지속. 입학 후에도 전문 내용을 정확히 이해·표현하도록 일본어를 갈고닦겠음", "kw": ["日本で暮らして", "日常会話", "漢字", "30分", "毎朝", "磨いて"]}, {"id": 30, "q": "日本には何歳まで住んでいましたか。日本の学校には通っていましたか。", "a": "生まれてから8歳ごろまで日本に住んでいて、日本の小学校には{{GRADE}}年生まで通いました。そのあと家族で韓国に移り、それからは韓国の学校で勉強してきました。", "type": "grade", "sum": "일본에 몇 살까지 살았고 일본 학교에 다녔나", "asum": "태어나서 8세경까지 일본 거주, 일본 초등학교 ○학년까지 다님(학생 입력). 이후 가족과 한국 이주, 한국 학교에서 공부", "kw": ["8歳", "小学校", "年生", "韓国に移", "韓国の学校"]}, {"id": 31, "q": "あなたの長所と短所を教えてください。", "a": "長所は、一つのことをこつこつ続けられるところです。フルートは6年ほど続けてきましたし、漢字の練習も毎朝欠かさずやってきました。短所は、嫌なことがあると、つい長く考えこんでしまうところです。でも最近は、起きたことをいつまでも考えるより、「じゃあ次に何ができるか」を考えるように意識しています。", "type": "normal", "sum": "장점과 단점", "asum": "장점: 한 가지를 꾸준히 이어감(플루트 약 6년, 매일 아침 한자 연습). 단점: 싫은 일이 있으면 오래 생각에 잠김 → 최근엔 '그럼 다음에 무엇을 할 수 있나'를 생각하도록 의식", "kw": ["こつこつ", "フルート", "6年", "漢字", "短所", ["長く考え", "考えこ"], "次に何ができる"]}, {"id": 32, "q": "趣味や、長く続けてきた活動はありますか。", "a": "6年ほどフルートを習っていて、地域のアマチュアオーケストラでも演奏してきました。一人で練習するときは自分の音に集中すればいいんですが、オーケストラでは周りの音をよく聞いて合わせないと、一つの曲になりません。毎日練習を続ける習慣も、みんなで一つのものを作り上げる楽しさも、フルートを通して学びました。大学に入っても、機会があれば音楽を続けたいです。", "type": "normal", "sum": "취미·오래 지속한 활동", "asum": "플루트 약 6년, 지역 아마추어 오케스트라에서도 연주. 오케스트라는 주변 소리를 듣고 맞춰야 한 곡이 됨 — 매일 연습하는 습관과 함께 만드는 즐거움을 배움. 대학에서도 기회가 되면 음악 지속", "kw": ["フルート", "6年", "オーケストラ", "周りの音", "毎日", "音楽"]}, {"id": 33, "q": "オーケストラで、大変だったことはありますか。", "a": "最初の頃は、自分の楽譜を追うのに必死で、周りの音を聞く余裕がありませんでした。練習のときに「もっと周りを聞いて」と言われて、それからは、ほかのパートも入った録音を聞いて、曲全体を頭に入れるようにしました。そうすると、自分が前に出るところと、支えに回るところが分かるようになりました。", "type": "normal", "sum": "오케스트라에서 힘들었던 점", "asum": "처음엔 자기 악보 따라가기 바빠 주변 소리를 들을 여유가 없었음. '더 주변을 들어라'는 말을 듣고 다른 파트가 든 녹음을 들으며 곡 전체를 파악 → 앞에 나설 곳과 받쳐줄 곳을 구분하게 됨", "kw": ["楽譜", "周りの音", "もっと周りを聞", "録音", "曲全体", "支え"]}, {"id": 34, "q": "最近読んだ本で、印象に残っているものはありますか。", "a": "『嫌われる勇気』という本です。さっき短所のところでも少しお話ししましたが、私は嫌なことがあったり、人間関係でうまくいかなかったりすると、それをずっと引きずってしまうタイプでした。でもこの本を読んで、過去の出来事が今の自分を決めるわけではない、という考え方を知りました。起きたこと自体より、そのあと自分がどう動くかのほうが大事なんだと思えるようになって、今は落ちこんでも、自分にできることを探すようにしています。", "type": "normal", "sum": "최근 읽은 인상 깊은 책", "asum": "『미움받을 용기』. 싫은 일·인간관계를 오래 끌고 가는 편이었으나 과거 사건이 지금의 나를 결정하지 않는다는 생각을 알게 됨 → 일어난 일보다 이후 어떻게 움직이는가가 중요, 낙담해도 할 수 있는 일을 찾음", "kw": ["嫌われる勇気", "引きずる", "過去", "決める", "どう動く", "自分にできること"]}, {"id": 35, "q": "その本の内容を、簡単に紹介してもらえますか。", "a": "アドラーという心理学者の考え方を、哲学者と、悩みを抱えた青年の対話の形で紹介した本です。「人は過去の原因に動かされるのではなく、今の目的に合わせて行動している」という考え方や、他人の期待に合わせて生きなくてもいい、ということが書かれています。対話の形になっているので、難しい内容でも読みやすかったです。", "type": "normal", "sum": "그 책 내용을 간단히 소개", "asum": "아들러 심리학을 철학 /* ===== 텍스트 정규화 / 채점 ===== */
const KNUM = {"〇":"0","一":"1","二":"2","三":"3","四":"4","五":"5","六":"6","七":"7","八":"8","九":"9","十":"10"};
function normChars(s){
  const out=[];
  for(let i=0;i<s.length;i++){
    for(let ch of s[i].normalize("NFKC").toLowerCase()){
      if(ch>="ァ" && ch<="ヶ") ch=String.fromCharCode(ch.charCodeAt(0)-0x60);
      if(KNUM[ch]) ch=KNUM[ch];
      for(const c2 of ch){ if(/[\p{L}\p{N}\p{M}]/u.test(c2)) out.push({ch:c2, idx:i}); }
    }
  }
  return out;
}
const normStr = s => normChars(s).map(o=>o.ch).join("");

function lcsPairs(a,b){
  const n=a.length,m=b.length,w=m+1,dp=new Uint16Array((n+1)*w);
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)
    dp[i*w+j]= a[i-1]===b[j-1] ? dp[(i-1)*w+j-1]+1 : Math.max(dp[(i-1)*w+j],dp[i*w+j-1]);
  const pairs=[]; let i=n,j=m;
  while(i>0&&j>0){
    if(a[i-1]===b[j-1]){pairs.push([i-1,j-1]);i--;j--;}
    else if(dp[(i-1)*w+j]>=dp[i*w+j-1]) i--; else j--;
  }
  return pairs.reverse();
}
function slice(orig, nc, from, to){ // nc: normChars, [from,to] 정규화 인덱스(포함) → 원문 조각
  if(from>to) return "";
  return orig.slice(nc[from].idx, nc[to].idx+1).trim();
}
function analyze(script, heard){
  const A=normChars(script), B=normChars(heard);
  const a=A.map(o=>o.ch), b=B.map(o=>o.ch);
  const pairs = (a.length&&b.length) ? lcsPairs(a,b) : [];
  const L=pairs.length;
  const matched=new Set(pairs.map(p=>A[p[0]].idx));
  const bad=new Set(); A.forEach((o,i)=>{ if(!pairs.some(p=>p[0]===i)) bad.add(o.idx); });
  const ops=[]; let pi=-1,pj=-1;
  const pts=pairs.concat([[a.length,b.length]]);
  for(const [ni,nj] of pts){
    const gs=[pi+1,ni-1], gt=[pj+1,nj-1];
    const sTxt=slice(script,A,gs[0],gs[1]), tTxt=slice(heard,B,gt[0],gt[1]);
    if(sTxt&&tTxt) ops.push({t:"sub",s:sTxt,h:tTxt});
    else if(sTxt) ops.push({t:"miss",s:sTxt});
    else if(tTxt && B.slice(gt[0],gt[1]+1).length>=2) ops.push({t:"extra",h:tTxt});
    pi=ni; pj=nj;
  }
  const coverage = a.length ? L/a.length : 0;
  const dice = (a.length+b.length) ? 2*L/(a.length+b.length) : 0;
  // 대본 글자별 오류 표시 (원문 인덱스)
  return {ops, bad:[...bad], coverage, dice, readScore:Math.round(100*(0.7*coverage+0.3*dice)), hLen:b.length};
}
function bigrams(s){ const set=new Set(); for(let i=0;i<s.length-1;i++) set.add(s.slice(i,i+2)); return set; }
function memoScore(q, script, heard){
  const hn=normStr(heard);
  const groups=(q.kw||[]).map(k=>Array.isArray(k)?k:[k]);
  const missKw=[], hitKw=[];
  groups.forEach(g=>{ (g.some(x=>hn.includes(normStr(x))) ? hitKw : missKw).push(g[0]); });
  const sb=bigrams(normStr(script)), hb=bigrams(hn);
  let hit=0; sb.forEach(x=>{ if(hb.has(x)) hit++; });
  const bg = sb.size? hit/sb.size : 0;
  const kw = groups.length ? hitKw.length/groups.length : bg;
  return {score:Math.round(100*(0.7*kw+0.3*bg)), missKw, hitKw};
}
function evaluate(q, heard, phase, passScore){
  const script=scriptOf(q);
  const an=analyze(script, heard);
  let score, missKw=[], hitKw=[];
  if(phase==="read"){ score=an.readScore; }
  else { const m=memoScore(q,script,heard); score=m.score; missKw=m.missKw; hitKw=m.hitKw; }
  const pass = score >= passScore;
  return {score, pass, ops:an.ops, bad:an.bad, missKw, hitKw, hLen:an.hLen};
}
function scriptHtml(script, badIdx){
  const bad=new Set(badIdx||[]);
  return [...script].map((c,i)=> bad.has(i) ? '<span class="bad">'+esc(c)+'</span>' : esc(c)).join("");
}

let ac=null;

const sleep = ms => new Promise(r=>setTimeout(r,ms));
let ttsBusy=false, ttsOn=true;
// 일본어 음성 선택: 부자연스러운 음성(맥의 Eddy/Reed 등 다국어 음성)은 피하고 자연스러운 음성을 우선
const BAD_VOICE=/Eddy|\bFlo\b|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Zarvox|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Albert|Fred|Junior|Kathy|Ralph|Princess/i;

function jaVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang)); }catch(e){ return []; } }
function voiceScore(v){
  let s=0; if(BAD_VOICE.test(v.name)) s-=100;
  GOOD_VOICE.forEach(([re,w])=>{ if(re.test(v.name)) s+=w; });

function pickVoice(){
  const list=jaVoices(); if(!list.length) return null;
  if(S.profile.voice){ const f=list.find(v=>v.name===S.profile.voice); if(f) return f; }
  return list.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];

const jaVoice = pickVoice;

/* ===== 마이크 ===== */
let micOk=false, lastMicErr=null;
async function ensureMic(){
  if(micOk) return true;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true; // 판단 불가 → 인식기에 맡김
  try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); st.getTracks().forEach(t=>t.stop()); micOk=true; lastMicErr=null; return true; }
  catch(e){ lastMicErr=e; return false; }
}
function micAdvice(code){
  const blocked="마이크가 차단되어 있어요. 주소창 왼쪽 자물쇠(또는 마이크) 아이콘 → 마이크 '허용' → 새로고침 해 주세요. 그래도 안 되면 PC 설정 → 개인정보 → 마이크에서 Chrome(Edge)을 허용하세요. 미리보기 창이나 카카오톡 같은 앱 안에서 열었다면 Chrome에서 파일을 직접 열어야 해요.";
  if(/NotAllowed|Security|PermissionDenied|not-allowed/.test(code||"")) return blocked;
  if(/service-not-allowed/.test(code||"")) return "이 브라우저가 음성인식 서비스를 허용하지 않아요. PC 또는 안드로이드의 Chrome / Edge에서 열어 주세요.";
  if(/NotFound|audio-capture|DevicesNotFound/.test(code||"")) return "마이크 장치를 찾을 수 없어요. 마이크(이어폰)가 연결되어 있는지 확인해 주세요.";
  if(/NotReadable|TrackStart/.test(code||"")) return "다른 프로그램(Zoom, Teams 등)이 마이크를 쓰고 있어요. 그 프로그램을 끄고 다시 시도해 주세요.";
  if(/network/.test(code||"")) return "음성인식 서버(구글)에 연결되지 않아요. 인터넷 연결을 확인하고, 학원/회사 네트워크라면 다른 네트워크(휴대폰 핫스팟)를 써 보세요. Edge에서 계속 안 되면 Chrome으로 열어 보세요.";
  if(/language-not-supported/.test(code||"")) return "이 브라우저가 일본어 음성인식을 지원하지 않아요.";
  return "마이크/음성인식 오류가 발생했어요 ("+(code||"알 수 없음")+"). '마이크 진단'을 실행해 보세요.";
}

/* ===== 음성 인식 엔진 =====
   - 질문마다 인식기를 새로 켜고, '듣는 중'임을 확인한 뒤에 비프를 울려요. → 질문 음성이 답변에 섞이지 않고, 비프 직후 첫마디부터 인식돼요.
   - 켜는 순간 접속 오류(network)가 나면 자동으로 다시 시도해요. 답변 도중 끊겨도 자동으로 다시 이어요.
   - 마이크는 훈련 내내 열어 두고(허용 창 최소화), 같은 마이크 신호로 '말이 끊긴 시간'을 직접 재서 자동 종료해요. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const GRACE_MS = 1000;      // 답변 종료 후 마지막 인식 결과를 기다리는 최대 시간
const NET_MAX = 3;          // 접속 오류 자동 재시도 횟수
let eng=null, engLive=false, engBoot=false, engArmed=false, engErr="", engNet=0, holdStream=null, win=null, timer=null;
const vad={an:null, src:null, buf:null, hist:[], t:null, alive:false, th:0.015, level:0};

function vadStart(){
  if(vad.t||!holdStream) return;
  try{
    unlockAudio(); if(!ac) return;
    vad.src=ac.createMediaStreamSource(holdStream); vad.an=ac.createAnalyser(); vad.an.fftSize=1024;
    vad.src.connect(vad.an); vad.buf=new Float32Array(vad.an.fftSize); vad.hist=[]; vad.alive=false;
    vad.t=setInterval(vadTick,100);
  }catch(e){ vad.an=null; }
}
function vadStop(){ clearInterval(vad.t); vad.t=null; try{ vad.src&&vad.src.disconnect(); }catch(e){} vad.src=null; vad.an=null; vad.alive=false; }
function vadTick(){
  const a=vad.an; if(!a) return;
  a.getFloatTimeDomainData(vad.buf); let sum=0; for(let i=0;i<vad.buf.length;i++) sum+=vad.buf[i]*vad.buf[i];
  const rms=Math.sqrt(sum/vad.buf.length);
  if(rms>0.0003) vad.alive=true;
  vad.hist.push(rms); if(vad.hist.length>100) vad.hist.shift();
  const so=vad.hist.slice().sort((x,y)=>x-y), floor=so[Math.floor(so.length*0.15)]||0;
  vad.th=Math.max(0.015, floor*3); vad.level=rms;
  if(rms>vad.th && win && win.on && !win.closing){ win.lastVoice=Date.now(); win.voiceMs=(win.voiceMs||0)+100; }
}

async function armMic(){
  engArmed=true; engErr="";
  if(!isMobile && !holdStream && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    try{ holdStream=await navigator.mediaDevices.getUserMedia({audio:true}); micOk=true; lastMicErr=null; }   // 마이크를 훈련 내내 열어 둠(데스크톱)
    catch(e){ lastMicErr=e; return false; }
  } else if(!holdStream && !(await ensureMic())) return false;
  vadStart();
  return true;
}
function killEngine(){
  const r=eng; eng=null; engLive=false; engBoot=false;
  if(r){ r.onend=r.onerror=r.onresult=r.onaudiostart=null; try{ r.abort(); }catch(e){} }
}
function disarmMic(){
  engArmed=false; clearInterval(timer);
  if(win){ win.on=false; win=null; }
  killEngine(); vadStop();
  if(holdStream){ holdStream.getTracks().forEach(t=>t.stop()); holdStream=null; }
}
function engFail(){ if(win&&win.on&&!win.closing){ win.err=engErr; stopRec(); } }
function startEngine(){
  if(!SR || eng) return;
  engBoot=true; engLive=false;
  const r=new SR(); eng=r; r.lang="ja-JP"; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
  r.onaudiostart=()=>{ if(eng===r){ engLive=true; engBoot=false; } };
  r.onresult=e=>{
    if(eng!==r) return;
    engNet=0;
    if(!win||!win.on) return;
    win.interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const x=e.results[i];
      if(x.isFinal) win.chunks.push({t:x[0].transcript, c:x[0].confidence, at:Date.now()});
      else win.interim+=x[0].transcript;
    }
    const txt=win.chunks.map(c=>c.t).join(" ")+" "+win.interim;
    if(txt.trim()){ win.hasSpeech=true; win.lastAct=Date.now(); }
    const el=$("#live"); if(el&&!win.closing) el.textContent=txt;
  };
  r.onerror=e=>{
    if(eng!==r) return;
    const c=e.error;
    if(c==="no-speech"||c==="aborted") return;
    if(c==="network"){ engNet++; if(engNet>=NET_MAX){ engErr=micAdvice("network"); engFail(); } return; }   // 일시적 접속 오류는 자동 재시도
    engErr=micAdvice(c); engFail();
  };
  r.onend=()=>{
    if(eng!==r) return;
    eng=null; engLive=false; engBoot=false;
    if(win&&win.on){
      if(win.closing){ finishRec(win); return; }
      if(engArmed&&!engErr) setTimeout(()=>{ if(win&&win.on&&!win.closing&&!eng) startEngine(); }, engNet?500:30);   // 답변 중 끊기면 곧바로 다시 켬
    }
  };
  try{ r.start(); }catch(e){ eng=null; engBoot=false; }
}
// 새 인식기를 켜고 '듣는 중' 확인. 켜자마자 접속 오류가 나면 자동 재시도
async function freshEngine(){
  if(!SR||!engArmed) return false;
  for(let k=0;k<NET_MAX;k++){
    killEngine(); engErr=""; engNet=0;
    startEngine();
    const t0=Date.now(); let up=false;
    while(Date.now()-t0<6000){ if(engErr) return false; if(engLive){ up=true; break; } if(!eng) break; await sleep(40); }
    if(up){
      const t1=Date.now();
      while(Date.now()-t1<500){ if(!eng||engNet>0||engErr) break; await sleep(40); }   // 켜진 직후 오류 여부 확인
      if(engErr) return false;
      if(eng&&engLive&&!engNet) return true;
    }
    await sleep(300);
  }
  engErr=micAdvice("network"); return false;
}
function echoLike(chunk, q){   // 면접관 질문이 스피커로 들어와 인식된 조각인지
  const a=normStr(q), b=normStr(chunk);
  if(!a||b.length<5) return false;
  return lcsPairs(a,b).length/b.length>=0.7;
}
function startRec(done, opt){
  const o=Object.assign({silence:SILENCE_MS, noSpeech:NOSPEECH_MS, max:180000, autoStop:true, q:""}, opt||{});
  clearInterval(timer);
  win={on:true, closing:false, cb:done, start:Date.now(), lastAct:Date.now(), lastVoice:0, voiceMs:0, hasSpeech:false, chunks:[], interim:"", q:o.q, opt:o, err:""};
  if(engArmed && !eng) startEngine();
  timer=setInterval(()=>{
    const w=win; if(!w||!w.on) return;
    const now=Date.now();
    const idle=now-Math.max(w.start, w.lastAct||0, w.lastVoice||0);   // 인식 결과도 마이크 소리도 없던 시간
    const speech=w.hasSpeech||w.voiceMs>=300;
    const el=$("#timer"); if(el) el.textContent=Math.round((now-w.start)/1000)+"초 · 조용한 시간 "+Math.floor(idle/1000)+"초";
    if(w.closing) return;
    if(now-w.start>o.max) stopRec();
    else if(o.autoStop && speech && idle>o.silence) stopRec();
    else if(o.autoStop && !speech && idle>o.noSpeech) stopRec();
  },250);
}
function stopRec(){
  const w=win; if(!w||!w.on||w.closing) return;
  w.closing=true; w.stopAt=Date.now();
  try{ eng&&eng.stop(); }catch(e){}            // 마지막 인식 결과를 내보내게 한 뒤 종료(onend에서 마무리)
  setTimeout(()=>finishRec(w), GRACE_MS);
}
function abortRec(){ clearInterval(timer); if(win){ win.on=false; win=null; } killEngine(); }
function finishRec(w){
  if(!w||w!==win||!w.on) return;
  clearInterval(timer); w.on=false; win=null;
  killEngine();
  const early=c=>(c.at-w.start)<2500 && w.q && echoLike(c.t,w.q);
  const kept=w.chunks.filter(c=>!early(c));
  const parts=kept.map(c=>c.t.trim()).filter(Boolean);
  const it=w.interim.trim(); if(it && !(w.q && (Date.now()-w.start)<2500 && echoLike(it,w.q))) parts.push(it);
  const low=kept.filter(c=>c.c>0&&c.c<0.75).map(c=>c.t.trim()).filter(Boolean);
  const text=parts.join(" ").trim();
  w.cb({text, low, dur:((w.stopAt||Date.now())-w.start)/1000, err: text ? "" : (w.err||engErr)});
}
window.addEventListener("beforeunload",()=>{ try{ disarmMic(); }catch(e){} });

/* ===== 질문 선택: 회차당 15문항, 꼬리질문 연결, 5회 안에 전체 질문 1회 이상 ===== */
const _autoFollow={};
function followOf(id){
  if(C.follow && C.follow[id] && C.follow[id].length) return C.follow[id];
  if(!_autoFollow[id]){ // 지정이 없으면 질문+답안의 내용 유사도로 연결
    const bg=q=>bigrams(normStr(q.q+scriptOf(q)));
    const me=bg(qById(id)), first=C.questions[0].id;
    const sc=C.questions.filter(q=>q.id!==id&&q.id!==first).map(q=>{ const o=bg(q); let i=0; me.forEach(x=>{ if(o.has(x)) i++; }); return {id:q.id, s:i/((me.size+o.size-i)||1)}; }).sort((a,b)=>b.s-a.s);
    _autoFollow[id]=sc.slice(0,3).filter(x=>x.s>0.06).map(x=>x.id);
  }
  return _autoFollow[id];
}
function weakScore(id){ const s=[]; S.done.forEach(d=>d.results.forEach(r=>{ if(r.id===id) s.push(r.score); })); return s.length? s.reduce((a,b)=>a+b,0)/s.length : 50; }
function pickWeak(arr){ return arr.slice().sort((a,b)=>(weakScore(a)-weakScore(b))+(Math.random()-0.5)*12)[0]; }
function buildQueue(n){
  const ids=C.questions.map(q=>q.id), first=ids[0], others=ids.slice(1);
  const want=SESSION_SIZE-1, b=blockStart(n), left=BLOCK-(n-b);
  const wasSeen=new Set([first]);
  S.done.filter(d=>blockStart(d.n)===b).forEach(d=>(d.queue||[]).forEach(id=>wasSeen.add(id)));
  const unseen=others.filter(id=>!wasSeen.has(id)), seenO=others.filter(id=>wasSeen.has(id));
  let newQ=Math.min(want, Math.ceil(unseen.length/left));       // 이번 회차에 처음 만나는 질문 수
  if(seenO.length < want-newQ) newQ=Math.min(unseen.length, want-seenO.length);
  const repQ=want-newQ;                                           // 복습(이미 나온) 질문 수 — 점수 낮은 것 우선
  const list=[first], used=new Set([first]); let nn=0, nr=0;
  const ok=id=>!used.has(id) && (wasSeen.has(id) ? nr<repQ : nn<newQ);
  const take=id=>{ used.add(id); list.push(id); if(wasSeen.has(id)) nr++; else nn++; return id; };
  let cur=first;
  while(list.length<want+1){
    const f=followOf(cur).filter(ok);                              // 꼬리질문 우선
    if(f.length){ cur=take(f[Math.floor(Math.random()*Math.min(2,f.length))]); continue; }
    const cn=others.filter(id=>ok(id)&&!wasSeen.has(id)), cr=others.filter(id=>ok(id)&&wasSeen.has(id));
    if(!cn.length && !cr.length) break;
    const remN=newQ-nn, remR=repQ-nr;
    const useNew = cn.length && (!cr.length || Math.random() < remN/(remN+remR));
    cur=take(useNew ? cn[Math.floor(Math.random()*cn.length)] : pickWeak(cr));
  }
  others.filter(id=>!used.has(id)).forEach(id=>{ if(list.length<want+1) take(id); });   // 안전장치
  return list;
}

/* ===== 세션 흐름 ===== */
let setupErr="", view = "dash", prevView="dash", reportN = null, qs = {mode:"ready", att:null, hints:0, typed:false, replays:0}, resetAsk=false, micTest=null, diag=null, flowId=0;
const freshQs = () => ({mode:"ready", att:null, hints:0, typed:false, replays:0, err:""});

function startSession(){
  if(!setupOk()){ view="setup"; render(); return; }
  unlockAudio();
  if(!S.cur){
    const n=S.done.length+1;
    S.cur={n, phase:phaseOf(n), pass:passFor(n), startedAt:Date.now(), queue:buildQueue(n), idx:0, res:{}, recSec:0, greeted:false, empties:0};
    save();
  }
  view="session"; qs=freshQs(); flowId++;
  render();
  if(!S.cur.greeted) speakAsync(C.greeting);
}
function curQ(){ return qById(S.cur.queue[S.cur.idx]); }

// 질문(음성) → 비프 → 녹음. 읽기: 재생 버튼을 눌렀을 때, 암기: 자동 반복
async function askAndRecord(q, opt){
  opt=opt||{};
  const my=++flowId; unlockAudio(); qs.err=""; qs.diag=false; engErr="";
  const ok=await armMic(); if(my!==flowId) return;
  if(!ok){ qs.mode="ready"; qs.err=micAdvice(lastMicErr&&lastMicErr.name); qs.diag=true; render(); return; }
  if(opt.tts!==false){
    qs.mode="ask"; render();
    await speakAsync(q.q); if(my!==flowId) return;
    await sleep(350); if(my!==flowId) return;       // 스피커 잔향이 사라진 뒤에 인식기를 켬(질문이 답변에 섞이지 않게)
  }
  if(SR){
    qs.mode="prep"; render();
    const live=await freshEngine(); if(my!==flowId) return;   // 듣는 중임을 확인한 뒤에 비프
    if(!live){ qs.mode="ready"; qs.err=engErr||micAdvice("network"); qs.diag=true; render(); return; }
  }
  qs.mode="beep"; render(); await beep(); if(my!==flowId) return;
  qs.mode="rec"; render();
  const memo = S.cur.phase==="memo";
  startRec(r=>{ if(my===flowId) onAnswer(q,r); }, {silence: memo?SILENCE_MS:SILENCE_MS+2000, noSpeech:NOSPEECH_MS, q:q.q});
}

function onAnswer(q, r){
  const cur=S.cur, ph=cur.phase;
  if(r.err){ qs.mode="ready"; qs.err=r.err; qs.diag=true; render(); return; }
  const hn=normStr(r.text), empty = hn.length<3;
  if(empty && ph==="read"){ qs.mode="ready"; qs.err="음성이 인식되지 않았어요. 마이크를 확인하고 조금 더 크게 말해 주세요."; render(); return; }
  cur.recSec += r.dur;
  const heard = empty ? "" : r.text;
  const ev=evaluate(q, heard, ph, cur.pass);
  const prev=cur.res[q.id] || {tries:0, firstScore:null, hints:0, replays:0};
  const rate = r.dur>1 ? ev.hLen/r.dur : 0, scriptRate = (ph==="read" && r.dur>2) ? normStr(scriptOf(q)).length/r.dur : 0;
  const att={...ev, heard, low:r.low, dur:r.dur, typed:qs.typed, noAnswer:empty, rate:Math.round(rate*10)/10, fast:(rate>=8||scriptRate>=9)};
  const tries=prev.tries+1;
  const best = (!prev.best || att.score>=prev.best.score) ? att : prev.best;
  cur.res[q.id]={id:q.id, tries, firstScore: prev.firstScore==null?att.score:prev.firstScore, best, last:att,
                 hints:(prev.hints||0)+(qs.hints||0), replays:(prev.replays||0)+(qs.replays||0), done:false,
                 atts:(prev.atts||[]).concat([{score:att.score, bad:att.bad, ops:att.ops.filter(o=>o.t!=="extra"), low:att.low}])};
  qs.hints=0; qs.replays=0;
  const res=cur.res[q.id];
  res.done = ph==="memo" ? true : (best.pass || tries>=MAX_TRIES);
  res.flagged = !best.pass;
  qs.att=att; save();
  if(ph==="memo"){
    cur.empties = empty ? (cur.empties||0)+1 : 0;
    qs.mode="saved"; qs.hold = cur.empties>=3; save(); render();
    if(!qs.hold){ const my=flowId; setTimeout(()=>{ if(my===flowId && view==="session" && S.cur) nextQuestion(); }, 1300); }
  } else { qs.mode="fb"; render(); }
}

function nextQuestion(){
  const cur=S.cur;
  stopSpeak();
  if(cur.idx+1>=cur.queue.length){ finishSession(); return; }
  cur.idx++; cur.empties = cur.empties||0; save(); qs=freshQs();
  render();
  if(cur.phase==="memo") askAndRecord(curQ());
}

function finishSession(){
  const cur=S.cur;
  const results=cur.queue.map(id=>{
    const r=cur.res[id]; const q=qById(id);
    return {id, q:q.q, script:scriptOf(q), kw:q.kw, tries:r.tries, firstScore:r.firstScore, score:r.best.score, pass:r.best.pass,
            heard:r.best.heard, ops:r.best.ops, bad:r.best.bad, missKw:r.best.missKw, hitKw:r.best.hitKw, low:r.best.low, hints:r.hints, replays:r.replays||0, atts:r.atts, typed:r.best.typed, noAnswer:!!r.best.noAnswer, flagged:r.flagged};
  });
  const rec={n:cur.n, phase:cur.phase, passScore:cur.pass, queue:cur.queue, startedAt:cur.startedAt, endedAt:Date.now(), recSec:Math.round(cur.recSec), results,
    passCount:results.filter(r=>r.pass).length, total:results.length,
    avg:Math.round(results.reduce((a,r)=>a+r.score,0)/results.length),
    hints:results.reduce((a,r)=>a+r.hints,0), replays:results.reduce((a,r)=>a+r.replays,0), typed:results.some(r=>r.typed)};
  S.done.push(rec); S.cur=null; disarmMic();
  // 10회차 관문: 평균이 기준 미달이면 6~10회를 다시 진행(1회). 재도전 후에도 미달이면 리포트 우선 제출
  if(S.done.length>=total()){
    const okGate = rec.avg>=GATE_SCORE;
    if(okGate || (S.extra||0)>=MAX_EXTRA_BLOCKS){ rec.gate={avg:rec.avg, passed:okGate, added:false}; }
    else { S.extra=(S.extra||0)+1; rec.gate={avg:rec.avg, passed:false, added:true}; }
  }
  save();
  reportN=rec.n;
  view = (S.done.length>=total()) ? "complete" : "report"; render();
}

/* ===== 리포트(선생님 제출용) ===== */
function hash(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(36).toUpperCase().padStart(7,"0"); }
function doneCode(){
  const base=S.done.map(d=>[d.n,d.startedAt,d.endedAt,d.avg,d.passCount].join(",")).join("|")+C.student;
  const c=(hash(base)+hash(base.split("").reverse().join(""))).slice(0,8); return c.slice(0,4)+"-"+c.slice(4);
}
/* ===== 통계 / 리포트 ===== */
const avgOf = a => a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length) : null;
const sumQ = q => q.sum || (q.q.length>34 ? q.q.slice(0,34)+"…" : q.q);
const sumA = q => q.type==="custom" ? "(학생 작성) "+(S.profile.other||"").slice(0,90) : (q.asum || (scriptOf(q).slice(0,70)+"…"));
const clip = (s,n) => { s=(s||"").replace(/\s+/g," ").trim(); return s.length>n ? s.slice(0,n)+"…" : s; };
const stageLabel = d => d.n>BASE_TOTAL ? "재도전" : (d.phase==="read"?"읽기":"암기");
function lastGate(){ const g=S.done.slice().reverse().find(d=>d.gate); return g ? Object.assign({n:g.n}, g.gate) : null; }

function qStats(){
  const m={};
  C.questions.forEach(q=>{ m[q.id]={id:q.id, n:0, scores:[], read:[], memo:[], fail:0, lastHeard:"", lastMemoHeard:"", lowAtt:0, atts:0}; });
  S.done.forEach(d=>d.results.forEach(r=>{
    const x=m[r.id]; if(!x) return;
    x.n++; x.scores.push(r.score); (d.phase==="read"?x.read:x.memo).push(r.score);
    if(!r.pass) x.fail++;
    if(r.heard){ x.lastHeard=r.heard; if(d.phase==="memo") x.lastMemoHeard=r.heard; }
    (r.atts||[]).forEach(a=>{ x.atts++; if(a.low&&a.low.length) x.lowAtt++; });
  }));
  return Object.values(m).filter(x=>x.n).map(x=>{
    x.avg=avgOf(x.scores); x.avgRead=avgOf(x.read); x.avgMemo=avgOf(x.memo);
    x.key = x.avgMemo!=null ? x.avgMemo : x.avg;            // 암기 점수가 있으면 그것을 기준으로 판정
    x.level = x.key<LOW_BELOW ? "low" : x.key<HIGH_FROM ? "mid" : "high";
    return x;
  });
}

// 발음/인식 문제: 읽기 단계 시도들에서 반복해서 인식되지 않은 구절, 자주 다르게 들린 말, 인식 신뢰도 낮은 질문
function pronStats(){
  const readAtts={}, lowByQ={}, pairs={};
  S.done.forEach(d=>d.results.forEach(r=>{
    (r.atts||[]).forEach(a=>{
      const l=(lowByQ[r.id]=lowByQ[r.id]||{n:0,low:0}); l.n++; if(a.low&&a.low.length) l.low++;
      if(d.phase==="read"){ const e=(readAtts[r.id]=readAtts[r.id]||{script:r.script,list:[]}); e.script=r.script; e.list.push(a); }
    });
  }));
  const phrases=[];
  Object.keys(readAtts).forEach(id=>{
    const {script,list}=readAtts[id], n=list.length, cnt=new Array(script.length).fill(0);
    list.forEach(a=>(a.bad||[]).forEach(i=>{ if(i<cnt.length) cnt[i]++; }));
    const thr = n>=2 ? Math.max(2,Math.ceil(n*0.5)) : 1;
    let run="", minHit=0;
    // 구두점(、。)에서 끊고, 20자를 넘는 긴 덩어리는 '발음'이 아니라 건너뛰었거나 끝까지 읽지 않은 부분으로 보고 제외
    const flush=()=>{ const L=run.length; if(L>=2 && L<=20) phrases.push({id:+id, text:run, hits:minHit, n}); run=""; minHit=0; };
    for(let i=0;i<script.length;i++){
      const ch=script[i], isL=/[\p{L}\p{N}]/u.test(ch);
      if(isL){ if(cnt[i]>=thr){ run+=ch; minHit=minHit?Math.min(minHit,cnt[i]):cnt[i]; } else flush(); }
      else flush();
    }
    flush();
    list.forEach(a=>(a.ops||[]).forEach(o=>{
      if(o.t==="sub" && o.s.length<=8 && o.h.length<=8){ const k=o.s+"→"+o.h; const p=(pairs[k]=pairs[k]||{s:o.s,h:o.h,c:0,ids:new Set()}); p.c++; p.ids.add(+id); }
    }));
  });
  phrases.sort((a,b)=>b.hits-a.hits || b.hits/b.n-a.hits/a.n);
  const pairList=Object.values(pairs).sort((a,b)=>b.c-a.c).filter((p,i)=>p.c>=2||i<5).slice(0,8).map(p=>({...p,ids:[...p.ids].sort((a,b)=>a-b)}));
  const lowQ=Object.keys(lowByQ).map(id=>({id:+id, ...lowByQ[id], rate:lowByQ[id].low/lowByQ[id].n})).filter(x=>x.low>0&&x.rate>=0.4).sort((a,b)=>b.rate-a.rate||b.low-a.low).slice(0,6);
  return {phrases:phrases.slice(0,12), pairs:pairList, lowQ};
}
function buildReport(){
  const all=qStats(), by=a=>a.slice().sort((x,y)=>x.key-y.key);
  return {qs:all, low:by(all.filter(x=>x.level==="low")), mid:by(all.filter(x=>x.level==="mid")), high:by(all.filter(x=>x.level==="high")).reverse(),
          pron:pronStats(), lg:lastGate(), finished:S.done.length>=total()};
}
function gateText(g){
  if(!g) return "진행 중 (최종 관문: "+BASE_TOTAL+"회차 평균 "+GATE_SCORE+"점)";
  if(g.passed) return BASE_TOTAL+"회차 관문 통과 — 평균 "+g.avg+"점 (기준 "+GATE_SCORE+"점)";
  if(g.added) return BASE_TOTAL+"회차 평균 "+g.avg+"점으로 기준("+GATE_SCORE+"점) 미달 → 6~10회 재도전 진행";
  return "⚠ 재도전 후에도 평균 "+g.avg+"점으로 기준("+GATE_SCORE+"점) 미달 — 리포트 우선 제출";
}

  sec("보통 질문 — "+LOW_BELOW+"~"+(HIGH_FROM-1)+"점", R.mid, true);

  const P=R.pron;
  L.push(" 1) 반복해서 인식되지 않은 구절 (대본을 읽을 때)");
  if(!P.phrases.length) L.push("    - 뚜렷한 반복 구절 없음");

  P.pairs.forEach(p=>L.push("    - 「"+p.s+"」 → 「"+p.h+"」 "+p.c+"회 (Q"+p.ids.join(", Q")+")"));
  L.push(" 3) 인식 신뢰도가 자주 낮았던 질문 (발음이 또렷하지 않았을 가능성)");
  if(!P.lowQ.length) L.push("    - 해당 없음");

function download(name, text){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
}
async function copy(text, btn){
  try{ await navigator.clipboard.writeText(text); }catch(e){
    const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand("copy");}catch(_){} t.remove(); }
  if(btn){ const o=btn.textContent; btn.textContent="복사됨 ✓"; setTimeout(()=>btn.textContent=o,1500); }
}

function gHash(str){ let h1=0xdeadbeef,h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (4294967296*(2097151&h2)+(h1>>>0)).toString(16); }
function gNorm(x){ return String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }

try{ speechSynthesis.onvoiceschanged=()=>{ if(view==="setup"&&!(micTest&&micTest.on)) render(); }; }catch(e){}
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target&&e.target.id==="gate-code"){ const b=document.querySelector('[data-act="gate-submit"]'); if(b) b.click(); } });
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act;
  if(act==="gate-submit"){
    const v=gNorm(($("#gate-code")||{}).value);
    if(C.gate && gHash(C.gate.salt+v)===C.gate.hash){ gateOk=true; gateErr=""; try{ localStorage.setItem(GATE_KEY,C.gate.hash); }catch(e){} render(); }
    else { gateErr="코드가 맞지 않아요. 선생님께 받은 코드를 다시 확인해 주세요."; render(); const i=$("#gate-code"); if(i) i.focus(); }
    return;
  }
  if(act==="start"){ startSession(); }
  else if(act==="go-dash"){ flowId++; stopSpeak(); disarmMic(); view="dash"; render(); }
  else if(act==="pause"){ flowId++; stopSpeak(); abortRec(); disarmMic(); view="dash"; render(); }
  else if(act==="setup"){ view="setup"; render(); }
  else if(act==="setup-save"){
    const g=$("#f-grade"), o=$("#f-other");
    if(g) S.profile.grade=g.value; if(o) S.profile.other=o.value.trim();
    if(!setupOk()){ setupErr="빠진 항목이 있어요. (학년 선택 / Q39 답변은 8자 이상)"; render(); return; }
    setupErr=""; save(); view="dash"; render();
  }
  else if(act==="diag"){ unlockAudio(); runDiag(); }
  else if(act==="diag-back"){ view=(prevView==="session"&&S.cur)?"session":"dash"; render(); }
  else if(act==="voice-test"){ unlockAudio(); const f=$("#f-voice"); if(f){ S.profile.voice=f.value; save(); } speakAsync("こんにちは。面接を始めます。まず、自己紹介をお願いします。"); }
  else if(act==="mic-test"){
    if(micTest&&micTest.on){ stopRec(); return; }
    micTest={on:true,text:"준비 중… (허용 창이 뜨면 '허용')"}; render();
    armMic().then(async ok=>{
      if(!ok){ micTest={on:false,text:micAdvice(lastMicErr&&lastMicErr.name)}; render(); return; }
      const live=await freshEngine();
      if(!live){ micTest={on:false,text:engErr||micAdvice('network')}; disarmMic(); render(); return; }
      micTest={on:true,text:"삐 소리 뒤에 말해 보세요 (6초)"}; render();
      await beep();
      startRec(r=>{ micTest={on:false,text:r.err||(r.text?"✔ 인식 결과: "+r.text:"소리가 인식되지 않았어요. 마이크 음량을 확인해 주세요.")}; disarmMic(); render(); },{autoStop:false});
      setTimeout(()=>stopRec(),6000);
    });
  }
  else if(act==="greet-next"){ stopSpeak(); S.cur.greeted=true; save(); qs=freshQs(); render(); if(S.cur.phase==="memo") askAndRecord(curQ()); }
  else if(act==="replay"){ speakAsync(C.greeting); }
  else if(act==="replay-q"){ speakAsync(curQ().q); }
  else if(act==="play"){ askAndRecord(curQ()); }
  else if(act==="replay-mid"){
    if(qs.replays<1){ qs.replays++; flowId++; abortRec(); stopSpeak(); askAndRecord(curQ()); }
  }
  else if(act==="rec-stop"){ stopRec(); const l=$("#live"); if(l) l.textContent="처리 중…"; }
  else if(act==="type-submit"){
    const v=($("#typed")||{}).value||""; qs.typed=true;
    onAnswer(curQ(),{text:v.trim(),low:[],dur:Math.max(5,v.length/4),err:""});
  }
  else if(act==="retry"){ qs={...freshQs(),typed:qs.typed}; askAndRecord(curQ(),{tts:false}); }
  else if(act==="next"){ nextQuestion(); }
  else if(act==="open-report"){ reportN=+t.dataset.n; view="report"; render(); }
  else if(act==="open-complete"){ view="complete"; render(); }
  else if(act==="copy-msg"){ copy(teacherMsg(), t); }
  else if(act==="copy-report"){ copy(reportText(), t); }
  else if(act==="dl-report"){ download("면접훈련리포트_"+C.student+".txt", reportText()); }
  else if(act==="reset-ask"){ resetAsk=true; render(); }
  else if(act==="reset-no"){ resetAsk=false; render(); }
  else if(act==="reset-do"){ S={profile:S.profile,done:[],cur:null,extra:0}; save(); resetAsk=false; render(); }
});
if("speechSynthesis" in window) speechSynthesis.getVoices();
view = "dash";
render();
</script>
</body>
</html>
