<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面接トレーニング</title>
<style>
:root{
  --ink:#1f2a44; --muted:#667085; --paper:#f6f3ee; --card:#ffffff; --line:#e7e0d4;
  --indigo:#2f4a8a; --indigo-d:#22386c; --indigo-l:#e8edf8;
  --red:#c0392b; --red-l:#fde8e4; --green:#2b7a57; --green-l:#e2f3ea; --amber:#b9770e; --amber-l:#fdf0d8;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);color-scheme:light;
  font-family:"Noto Sans JP","Hiragino Sans","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{margin:0;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;
  padding:10px 18px;border-radius:999px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--indigo)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.primary:hover{background:var(--indigo-d)}
.btn.rec{background:var(--red);border-color:var(--red);color:#fff}
.btn.big{padding:14px 28px;font-size:17px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.badge.read{background:var(--indigo-l);color:var(--indigo)}
.badge.memo{background:var(--amber-l);color:var(--amber)}
.badge.ok{background:var(--green-l);color:var(--green)}
.badge.ng{background:var(--red-l);color:var(--red)}
.hero{background:linear-gradient(135deg,#22386c,#3a5aa5);color:#fff;border:none}
.hero .muted{color:#cfd9f2}
.hero h1{font-size:24px}
.dday{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 16px;text-align:center}
.dday b{font-size:26px;display:block;line-height:1.1}
.steps{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.step{aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;
  border:2px dashed var(--line);color:var(--muted);background:#fff;font-size:15px;max-width:64px;margin:0 auto;width:100%}
.step.done{border:2px solid var(--green);background:var(--green);color:#fff}
.step.now{border:2px solid var(--indigo);color:var(--indigo);box-shadow:0 0 0 4px var(--indigo-l)}
.step-lab{text-align:center;font-size:11px;margin-top:4px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--paper);border-radius:12px;padding:14px;text-align:center}
.stat b{font-size:24px;display:block}
.bar{height:8px;background:#ece7dd;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--indigo);transition:width .3s}
.qbox{border-left:5px solid var(--indigo);background:var(--indigo-l);border-radius:10px;padding:16px 18px}
.qbox .q{font-size:22px;font-weight:700}
.script{font-size:21px;line-height:2;padding:18px;border-radius:12px;background:#fffdf8;border:1px solid var(--line);letter-spacing:.02em}
.script.hidden{display:none}
.bad{background:var(--red-l);color:var(--red);border-bottom:2px solid var(--red);border-radius:3px;font-weight:700}
.live{min-height:56px;padding:12px 16px;border-radius:12px;background:#f2f4f8;color:#475467;font-size:17px;margin:12px 0}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.ring{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:conic-gradient(var(--c) calc(var(--p)*1%),#ece7dd 0)}
.ring span{width:74px;height:74px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.diff{list-style:none;padding:0;margin:8px 0}
.diff li{padding:8px 12px;border-radius:8px;background:var(--paper);margin-bottom:6px;font-size:16px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:8px}
.tag.miss{background:var(--red-l);color:var(--red)} .tag.sub{background:var(--amber-l);color:var(--amber)} .tag.extra{background:var(--indigo-l);color:var(--indigo)}
.chip{display:inline-block;background:var(--amber-l);color:var(--amber);padding:4px 12px;border-radius:99px;margin:3px;font-weight:700;font-size:14px}
.chip.miss{background:var(--red-l);color:var(--red)} .chip.hit{background:var(--green-l);color:var(--green)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;background:#fff}
summary{cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
textarea,input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
label{font-weight:700;display:block;margin:14px 0 6px}
.notice{background:var(--amber-l);color:#7a4b06;padding:12px 14px;border-radius:10px;font-size:14px}
.ok-box{background:var(--green-l);color:#1d5a40;padding:12px 14px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.celebrate{text-align:center;padding:32px 20px}
.celebrate h1{font-size:30px;margin:8px 0 12px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;letter-spacing:.12em;background:var(--paper);padding:8px 16px;border-radius:10px;display:inline-block}
pre.rep{white-space:pre-wrap;background:var(--paper);padding:14px;border-radius:10px;font-size:13px;max-height:340px;overflow:auto;font-family:inherit}
@media(max-width:560px){.qbox .q{font-size:19px}.script{font-size:18px}.hero h1{font-size:20px}.steps{gap:4px}.step{font-size:12px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";
const C = {"school": "同志社大学 グローバル・コミュニケーション学部（日本語コース）", "title": "모의면접 진행 순서 시트 — 선아연 학생", "info": "", "greeting": "こんにちは。どうぞお掛けください。まず、受験番号とお名前をお願いします。", "student": "선아연", "questions": [{"id": 1, "q": "自己紹介をお願いします。", "a": "はじめまして。韓国から来ました、ソン・アヨンです。日本人の母と韓国人の父のもと日本で生まれて、8歳まで日本で暮らしてから韓国に移りました。二つの国で育ったので、同じ一言でも国によって伝わり方が変わる、ということを小さい頃から肌で感じてきました。今日は、そういう経験から生まれた「伝わるコミュニケーション」への関心についてお話しできればと思います。どうぞよろしくお願いいたします。", "type": "normal", "sum": "자기소개", "asum": "한국에서 온 송아연. 일본인 엄마·한국인 아빠, 일본 출생·8세까지 거주 → 두 나라에서 자라 같은 말도 전달 방식이 달라짐을 체감 → '전달되는 커뮤니케이션'에 관심", "kw": ["アヨン", ["日本で生ま", "日本で生れ"], "8歳", ["伝わり方", "伝わる"], "コミュニケーション"]}, {"id": 2, "q": "グローバル・コミュニケーション学部を志望した理由を教えてください。", "a": "高校のときに、日本の昔話の『耳なし芳一』を、韓国と日本の友達が一緒に見る動画にしたのがきっかけです。作ってみると、日本の友達には当たり前の背景が、韓国の友達には全然伝わらないことに気づきました。言葉を訳すだけでは足りなくて、相手が何を知っていて、何を知らないかまで考えないと伝わらないんだと思ったんです。この学部の日本語コースは、留学生が日本語で、日本の「ことば」と「文化」と「社会」をまとめて学べるコースです。しかも少人数で、英語コースや中国語コースの日本人学生とも一緒に学べます。日本語を使う側としてだけでなく、日本の社会に入っていく側として、背景の違う人同士がどうやって分かり合っていくのかを、ここなら実際に体験しながら学べると思って志望しました。", "type": "normal", "sum": "글로벌 커뮤니케이션학부 지망 이유", "asum": "고교 때 '미미나시 호이치' 영상을 한일 친구용으로 제작 → 일본 친구에겐 당연한 배경이 한국 친구에겐 안 통함을 깨달음 → 번역만으론 부족, 상대의 지식까지 고려해야 함 → 소규모로 일본어코스에서 말·문화·사회를 함께 배우고 타 코스 일본인 학생과도 교류 가능", "kw": ["耳なし芳一", ["動画", "ビデオ"], "背景", ["日本語コース", "日本語コ"], "少人数", "社会"]}, {"id": 3, "q": "（関連質問）日本で生まれ育ったとのことですが、ご自身では日本と韓国、どちらの文化に近いと感じていますか。", "a": "正直、どちらか一つとは言えないです。韓国の友達には「考え方が日本っぽいね」と言われることがあって、逆に日本の親戚に会うと「やっぱり韓国の子だね」と言われたりもします。前はそれが少し寂しかったんですが、今は、どちらの立場にも立って考えられるのが自分の強みだと思えるようになりました。", "type": "normal", "sum": "(관련) 일본·한국 중 어느 문화에 가깝다고 느끼나", "asum": "어느 한쪽이라 단정 못 함. 한국 친구는 '일본스럽다', 일본 친척은 '한국 아이네'라 함 → 예전엔 쓸쓸했지만 지금은 양쪽 입장에서 생각하는 것이 강점", "kw": ["どちらか一つ", "強み", ["日本っぽい", "日本らしい"], "寂し"]}, {"id": 4, "q": "日本への留学を決めたのはどうしてですか。", "a": "一つは、自分が生まれた日本で、もう一度ちゃんと学びたいという気持ちです。もう一つは地震のことです。幼稚園のときに東日本大震災があって、そのあと園で何度も避難訓練をしました。大きくなってから、日本では災害のときに、外国の人にも伝わるように「やさしい日本語」で情報を出していると知りました。同じ情報でも、伝え方を変えれば届く人が増えるんだと思って、それが実際に使われている日本で学びたいと考えました。", "type": "normal", "sum": "일본 유학을 결심한 이유", "asum": "태어난 일본에서 다시 제대로 배우고 싶음 + 유치원 때 동일본대지진·피난훈련 → 일본은 재해 시 '쉬운 일본어'로 정보 제공 → 전달 방식을 바꾸면 닿는 사람이 늘어난다고 생각해 일본에서 배우고 싶음", "kw": ["地震", ["東日本大震災", "震災"], "避難訓練", "やさしい日本語", "伝え方"]}, {"id": 5, "q": "（圧迫質問）震災のときは、まだ幼稚園の頃ですよね。本当に覚えているんですか。", "a": "地震そのものを細かく覚えているわけではないんですが、そのあと幼稚園で何度も避難訓練をしたことは、よく覚えています。先生が「おさない、はしらない、しゃべらない、もどらない」の「おはしも」を、私たちにも分かる短い言葉で何回も教えてくれました。今思うと、小さい子どもにも伝わるように、言葉を選んでいたんですよね。「やさしい日本語」のことを知ったとき、あのときの先生の伝え方と同じだと思って、すごく印象に残りました。", "type": "normal", "sum": "(압박) 지진 때 유치원생이었는데 정말 기억하나", "asum": "지진 자체는 세세히 기억 못 하지만 이후 피난훈련은 선명. 선생님이 '오하시모'를 쉬운 말로 반복 교육 → 어린아이에게도 전달되게 말을 고른 것 → '쉬운 일본어'와 같다고 느껴 인상 깊었음", "kw": ["避難訓練", ["おはしも", "おさない"], "短い言葉", "やさしい日本語", "先生"]}, {"id": 6, "q": "学部ではなく、同志社大学そのものに魅力を感じた点は何ですか。", "a": "新島襄が大切にした、「良心」を持った人を育てるという考え方に惹かれました。知識を身につけるだけじゃなくて、それを人のためにどう使うかを大事にしている大学だと感じたからです。私も将来、困っている人にちゃんと情報が届く仕組みを作りたいので、その考え方にすごく共感しました。それから、同志社は創立の頃から国際主義を掲げていて、今もいろいろな国の留学生が学んでいます。そういう環境で4年間を過ごせることも、大きな魅力です。", "type": "normal", "sum": "학부가 아닌 도시샤대학 자체의 매력", "asum": "니지마 조의 '양심을 가진 사람 육성' 사상에 공감(지식을 사람을 위해 쓰는 것) + 창립 때부터 국제주의, 다양한 유학생과 4년 생활", "kw": ["新島襄", "良心", "国際主義", "留学生"]}, {"id": 7, "q": "同じような学部はほかの大学にもありますが、なぜ同志社のグローバル・コミュニケーション学部なんですか。", "a": "一番の理由は、英語コース・中国語コース・日本語コースの学生が一緒にプロジェクトを進める「Seminar Project」があることです。いろいろな言葉を学んでいる学生と何かを一緒に作る中で、自分一人では気づけない「伝わらなさ」に出会えると思いました。それに、日本人の学生と留学生がペアになって言葉を教え合う、タンデム・パートナーの制度もあります。教室の外でも異文化コミュニケーションを実際に体験できるところが、ほかの大学にはない魅力だと思います。", "type": "normal", "sum": "다른 대학 유사 학부 대신 도시샤 GC학부인 이유", "asum": "영어·중국어·일본어 코스 학생이 함께하는 Seminar Project + 일본인과 유학생이 짝이 되는 탠덤 파트너 제도 → 교실 밖에서도 이문화 커뮤니케이션 체험 가능", "kw": ["Seminar Project", ["タンデム", "パートナー"], "英語コース", "中国語コース", "異文化"]}, {"id": 8, "q": "外国語学部ではなく、この学部を選んだのはなぜですか。", "a": "私が知りたいのは、言葉そのものよりも、言葉を使う人同士がどうやって分かり合うのか、ということなんです。外国語学部だと、語彙や文法などの語学力を高めることが中心になると思うんですが、私は、同じ言葉を聞いても育った環境によって受け取り方が違う、というところに興味があります。だから、言語と一緒に文化や社会も見ていけるこの学部が、自分に合っていると思いました。", "type": "normal", "sum": "외국어학부가 아닌 이 학부를 택한 이유", "asum": "관심은 말 자체보다 '말을 쓰는 사람끼리 어떻게 이해하는가' → 외국어학부는 어휘·문법 중심 → 자란 환경에 따라 같은 말도 받아들임이 다름에 관심 → 언어+문화+사회를 보는 이 학부가 적합", "kw": ["語学力", "育った環境", "受け取り方", ["文化と社会", "文化や社会"]]}, {"id": 9, "q": "（圧迫質問）お母様が日本の方で、日本語もかなり話せますよね。わざわざ日本語コースで学ぶ意味はあるんでしょうか。", "a": "日常会話には困りませんが、大学で学ぶための日本語はまだこれからだと感じています。難しい文章を正確に読んだり、自分の考えを筋道立てて書いたりする力は、もっと伸ばしたいところです。それに、日本語コースは日本語を勉強するだけじゃなくて、日本の文化や社会を、外から来た人の目で考えるコースだと理解しています。日本と韓国の両方を知っている私だからこそ、日本で当たり前とされていることに「あれ？」と気づける場面があると思うので、その視点を授業でも生かしたいです。", "type": "normal", "sum": "(압박) 엄마가 일본인이라 일본어 잘하는데 일본어코스의 의미", "asum": "일상회화는 문제없지만 대학 수준의 읽기·논리적 글쓰기는 더 필요 + 일본어코스는 외부인의 눈으로 일본 문화·사회를 보는 곳 → 한일 양쪽을 아는 시각을 수업에 살리고 싶음", "kw": ["日常会話", "筋道", "書い", "外から", "視点"]}, {"id": 10, "q": "日本と韓国で、同じことでも受け取られ方が違うと感じた経験はありますか。", "a": "食堂でお店の人を呼ぶときの言い方です。日本だと「すみません」が普通ですよね。でも韓国では、お店のおばさんを「イモ」と呼ぶことがあるんです。「イモ」は本当は「母の姉妹」、つまり「おばさん」という意味なので、最初は、親戚でもないのに変だなと思っていました。でも、よく行くお店でそう呼んでみたら、「やっと仲良くなれたね」とすごく喜んでもらえて。言葉には辞書の意味だけじゃなく、その国の人間関係の作り方が入っているんだと実感しました。", "type": "normal", "sum": "한일 간 받아들임이 다르다고 느낀 경험", "asum": "식당에서 점원 부를 때 일본은 '스미마센', 한국은 '이모' → 처음엔 어색했지만 단골집에서 써 보니 친해졌다며 기뻐함 → 말에는 사전 뜻뿐 아니라 그 나라의 관계 맺는 방식이 담김", "kw": ["すみません", "イモ", "おばさん", "仲良く", "人間関係"]}, {"id": 11, "q": "（関連質問）では逆に、日本の「すみません」には、どんな気持ちが込められていると思いますか。", "a": "「すみません」は、謝るときにも、お礼を言うときにも、人を呼ぶときにも使えますよね。お店の人を呼ぶときも、「お仕事中にごめんなさい」という気持ちが少し入っているんじゃないかと思います。相手との距離をちょうどよく保って、失礼にならないようにする言葉なのかなと。「イモ」が距離を縮める言葉だとすると、「すみません」は距離を大切にする言葉で、そこに二つの文化の違いが表れていると思います。", "type": "normal", "sum": "(관련) 일본 '스미마센'에 담긴 마음", "asum": "사과·감사·부르기에 모두 쓰임. '일하는 데 죄송합니다'는 마음이 섞여 거리를 적당히 유지하고 실례를 피하는 말 → '이모'는 거리를 좁히는 말, '스미마센'은 거리를 존중하는 말로 두 문화 차이가 드러남", "kw": ["謝る", "お礼", "距離", "ごめんなさい", "違い"]}, {"id": 12, "q": "高校で作った『耳なし芳一』の動画について、詳しく教えてください。", "a": "韓国と日本の友達が一緒に見る動画として作って、私は企画とセリフを担当しました。参考にした脚本では、壇ノ浦の戦いのことが少ししか書かれていなかったんです。でも、それだと韓国の友達には、亡霊たちがどうして芳一の演奏を聞いて悲しむのかが分からないと思いました。そこで、平家が戦いに負けて、たくさんの人が海で亡くなったという場面を先にしっかり見せてから、芳一の演奏の場面につなげるように、順番を変えました。", "type": "normal", "sum": "고교 때 만든 '미미나시 호이치' 영상 상세", "asum": "한일 친구가 함께 볼 영상, 기획·대사 담당 → 참고 대본은 단노우라 전투 설명이 적어 한국 친구가 망령의 슬픔을 이해 못 함 → 헤이케 패전·바다에서 많은 사람이 죽은 장면을 먼저 보여 주도록 순서 변경", "kw": ["企画", "セリフ", "壇ノ浦", "平家", "順番"]}, {"id": 13, "q": "（関連質問）『耳なし芳一』がどんなお話か、簡単に説明してもらえますか。", "a": "はい。琵琶がとても上手な、目の見えない芳一という琵琶法師のお話です。ある夜から芳一は、身分の高い人に呼ばれて、毎晩『平家物語』の壇ノ浦の場面を語りに行くようになります。でも、実はその相手は、戦いで亡くなった平家の亡霊でした。それに気づいたお寺の和尚さんが、芳一の体中にお経を書いて守るんですが、耳にだけ書き忘れてしまって、亡霊に耳を取られてしまう、というお話です。", "type": "normal", "sum": "(관련) '미미나시 호이치' 줄거리", "asum": "비파를 잘 타는 맹인 호이치가 매일 밤 귀한 사람에게 불려 '헤이케 이야기'를 들려줌 → 사실은 헤이케 망령 → 스님이 온몸에 경문을 써 지켜 주나 귀에만 빠뜨려 망령이 귀를 가져감", "kw": ["琵琶", "芳一", "平家物語", "亡霊", "お経", "耳"]}, {"id": 14, "q": "志望理由書に「情報を提供するだけでは十分ではない」とありますが、どういうことですか。", "a": "情報を出すだけなら、一方的にでもできますよね。でも、相手がその意味を分かって、受け止めてくれて初めてコミュニケーションになると思うんです。芳一の動画でも、私が知っていることをそのまま全部入れていたら、韓国の友達には伝わらなかったと思います。大事なのは、どれだけたくさん伝えたかより、相手がどう受け取ったか。そこを考えることだと思っています。", "type": "normal", "sum": "지망이유서의 '정보 제공만으로는 부족'의 뜻", "asum": "정보를 내놓는 건 일방적으로도 가능 → 상대가 의미를 알고 받아들여야 비로소 커뮤니케이션 → 호이치 영상도 아는 걸 다 넣었다면 안 통했을 것 → 얼마나 많이 전했나보다 상대가 어떻게 받았나가 중요", "kw": ["一方的", "受け止め", "コミュニケーション", "どう受け取った"]}, {"id": 15, "q": "（圧迫質問）では、どんな相手とでも完璧に分かり合うことはできると思いますか。", "a": "完璧に、というのは難しいと思います。人によって育った環境も考え方も違うので、同じ言葉でも受け取り方はどうしてもずれてしまいます。でも、そのずれをゼロにすることが目的ではないと思うんです。「違って受け取られるかもしれない」と分かったうえで、言い方や説明を少しずつ調整していく。その積み重ねで、ずれを小さくしていくことがコミュニケーションなんじゃないかと考えています。", "type": "normal", "sum": "(압박) 어떤 상대와도 완벽히 이해할 수 있나", "asum": "완벽은 어려움. 환경·사고방식이 달라 받아들임이 어긋남 → 어긋남을 없애는 게 목적이 아니라, 다르게 받아들여질 수 있음을 알고 표현·설명을 조금씩 조정해 어긋남을 줄이는 것이 커뮤니케이션", "kw": ["完璧", "難しい", "ずれ", "調整", "小さく"]}, {"id": 16, "q": "日本人のコミュニケーションで、外国の人が戸惑いやすいのはどんなところだと思いますか。", "a": "はっきり言わない、遠回しな言い方だと思います。例えば、何かを断るときに「ちょっと考えておきます」と言うことがありますよね。日本人同士なら「難しいんだな」と分かりますが、外国の人だと、本当に考えてくれていると受け取ってしまうかもしれません。相手を傷つけないための優しさなんですが、知らないと誤解につながります。こういう「言葉の裏にある意味」をどう伝えるかも、学んでみたいことの一つです。", "type": "normal", "sum": "일본인 커뮤니케이션에서 외국인이 당황하기 쉬운 점", "asum": "분명히 말하지 않는 돌려 말하기. 예: 거절할 때 '조금 생각해 보겠습니다' → 일본인은 '어렵구나' 알지만 외국인은 진짜 고민한다고 받아들임 → 배려지만 모르면 오해 → 말 뒤의 의미를 어떻게 전할지도 배우고 싶음", "kw": ["遠回し", "ちょっと考えておきます", "断る", "誤解", "優しさ"]}, {"id": 17, "q": "入学後は、どんな授業を受けたいですか。", "a": "まず「日本語コミュニケーションの基礎」で、場面や相手によって日本語の言い方や意味がどう変わるのかを、基礎から学びたいです。そのうえで、「グローバル化と日本社会」で、日本で暮らす外国の人たちが、情報を受け取るときや周りと関係を作るときに、どんなところで困っているのかを考えたいと思っています。", "type": "normal", "sum": "입학 후 듣고 싶은 수업", "asum": "'일본어 커뮤니케이션 기초'로 상황·상대에 따라 일본어 표현·의미 변화를 기초부터 + '글로벌화와 일본 사회'로 일본 거주 외국인이 정보 수신·관계 형성에서 어디서 어려워하는지 고찰", "kw": ["日本語コミュニケーションの基礎", "グローバル化と日本社会", "外国の人", "困って"]}, {"id": 18, "q": "（関連質問）「ワークショップ現代日本社会」も志望理由書に書いていますね。どんなことを期待していますか。", "a": "この授業では、企業や自治体などで活躍している方がゲストとして来て、お話を聞いたり意見を交換したりできると知りました。本だけでは分からない、現場の生の声が聞けるのがすごく楽しみです。例えば、自治体が外国人の住民にどうやって情報を届けているのか、実際にどんな工夫や苦労があるのかを、ぜひ直接聞いてみたいです。", "type": "normal", "sum": "(관련) '워크숍 현대 일본 사회'에 기대하는 것", "asum": "기업·지자체 활동가가 게스트로 와 이야기·의견 교환 → 책으로는 알 수 없는 현장의 생생한 목소리 → 지자체가 외국인 주민에게 정보를 어떻게 전하는지, 노력과 고충을 직접 듣고 싶음", "kw": ["ゲスト", "自治体", "現場", "生の声", "本だけでは"]}, {"id": 19, "q": "「専門演習」と「Seminar Project」では、どんなことに取り組みたいですか。", "a": "Seminar Projectでは、英語コースや中国語コースの学生と一緒に、一つの企画を作ってみたいです。使う言葉も育った場所も違うメンバーなので、最初は話がかみ合わないこともあると思います。でも、その「かみ合わなさ」こそ、私が考えたいテーマの材料になると思っています。専門演習では、そういう経験をもとに、言葉や文化が違っても情報が正しく伝わるには何が必要なのか、自分でテーマを決めて研究したいです。", "type": "normal", "sum": "전문연습·Seminar Project에서 하고 싶은 것", "asum": "영어·중국어 코스 학생과 하나의 기획 제작 → 처음엔 어긋나도 그 '어긋남'이 연구 테마의 재료 → 전문연습에서 언어·문화가 달라도 정보가 정확히 전해지려면 무엇이 필요한지 스스로 테마를 정해 연구", "kw": ["Seminar Project", "かみ合わな", "専門演習", "自分でテーマ", "研究"]}, {"id": 20, "q": "興味のあるゼミや先生はいますか。", "a": "鈴木伸子先生のゼミに興味があります。多文化社会や、異なる文化の人どうしが接するときに起きる問題をテーマにしていて、先輩方が「日本のテレビCMで外国人がどう描かれてきたか」や「留学生の就職」といったテーマで研究していると知りました。私も、日本で暮らす外国の人に情報がどう届いているのか、どこでつまずいているのかを、実際に人に話を聞きながら調べてみたいです。ただ、まだ入学前なので、1・2年生のうちにいろいろな授業を受けて、テーマをしっかり固めてから選びたいと思っています。", "type": "normal", "sum": "관심 있는 세미나·교수", "asum": "스즈키 노부코 교수 세미나(다문화사회, 이문화 접촉 시 문제) → 선배들이 'TV CM 속 외국인', '유학생 취업' 등을 연구 → 일본 거주 외국인에게 정보가 어떻게 닿고 어디서 막히는지 직접 청취 조사하고 싶음. 단, 입학 전이라 1·2학년에 여러 수업을 듣고 테마를 굳힌 뒤 선택", "kw": ["鈴木伸子", "多文化社会", "テレビCM", "留学生の就職", "入学前"]}, {"id": 21, "q": "グループで、ほかの国の学生と意見がぶつかったら、どうしますか。", "a": "すぐに自分の意見を通そうとするんじゃなくて、まず「どうしてそう思うの？」と理由を聞くようにしています。私は地域のアマチュアオーケストラでフルートを吹いていたんですが、同じ曲でも、人によって大事にしたいところが全然違って、何度も話し合いました。そのときは「いい演奏にしたい」という同じゴールに戻って考えることで、うまくまとまりました。大学でも、どちらかが我慢するんじゃなくて、お互いが納得できる形を探したいです。", "type": "normal", "sum": "그룹에서 타국 학생과 의견이 부딪히면", "asum": "바로 내 의견을 관철하지 않고 먼저 '왜 그렇게 생각해?' 이유를 물음 → 아마추어 오케스트라 플루트 경험, 같은 곡도 중시점이 달라 대화 → '좋은 연주'라는 같은 목표로 돌아가 정리 → 대학에서도 한쪽이 참지 않고 서로 납득할 형태를 찾음", "kw": ["理由を聞く", "フルート", "オーケストラ", "同じゴール", "納得"]}, {"id": 22, "q": "卒業後は、どんな仕事をしたいと考えていますか。", "a": "デジタルサービスの分野で、いろいろな人が使いやすいサービスを企画する仕事がしたいです。今は、情報を何か国語にも訳して出すサービスが多いと思うんですが、訳すだけだと、日本の生活に慣れていない人には伝わらないこともあります。使う人の言葉や文化、情報の受け取り方まで考えて、誰でも必要な情報にたどり着けるサービスを作るのが目標です。", "type": "normal", "sum": "졸업 후 하고 싶은 일", "asum": "디지털 서비스 분야에서 누구나 쓰기 쉬운 서비스 기획 → 번역만 하면 일본 생활에 익숙지 않은 사람에겐 안 통함 → 사용자의 언어·문화·정보 수용 방식까지 고려해 누구나 필요한 정보에 도달하는 서비스가 목표", "kw": ["デジタルサービス", "使いやすい", "訳すだけ", "受け取り方", "目標"]}, {"id": 23, "q": "（関連質問）具体的には、どんなサービスをイメージしていますか。", "a": "まだ一つに決めているわけではないんですが、関心があるのは、災害や緊急のときに、外国人や留学生が自分に必要な情報をすぐに見つけられるサービスです。例えば、ただ翻訳するだけじゃなくて、「今すぐやること」を短く、やさしい言葉で先に見せる、といった工夫です。どんな情報をどの順番で出せば伝わるのかは、芳一の動画で考えたことと同じなので、大学でいろいろな例を学びながら、もっと具体的にしていきたいです。", "type": "normal", "sum": "(관련) 구체적으로 어떤 서비스를 생각하나", "asum": "미정이나 재해·긴급 시 외국인·유학생이 필요한 정보를 바로 찾는 서비스 → 번역만이 아니라 '지금 할 일'을 짧고 쉬운 말로 먼저 보여 줌 → 어떤 정보를 어떤 순서로 내야 전해지는지는 호이치 영상과 같아 대학에서 사례를 배워 구체화", "kw": ["災害", "緊急", "今すぐやること", "やさしい言葉", "芳一"]}, {"id": 24, "q": "（圧迫質問）AIや自動翻訳がこれだけ進んでいるのに、わざわざこの学部で学ぶ必要がありますか。", "a": "AIの翻訳は本当に便利で、私もよく使っています。でも、翻訳は言葉を置き換えてはくれても、その言葉が相手にどう受け取られるかまでは考えてくれないと思うんです。さっきの「イモ」も、そのまま訳せば「おばさん」ですが、そこに込められた親しさまでは伝わりません。だから、技術と競うんじゃなくて、技術をうまく使いながら、相手に本当に伝わる形を考えられる人になりたい。そのために、この学部で学ぶ意味があると思っています。", "type": "normal", "sum": "(압박) AI·자동번역이 발전했는데 이 학부에서 배울 필요가 있나", "asum": "AI 번역은 편리하고 자주 씀 → 그러나 말을 바꿔 줄 뿐 상대가 어떻게 받아들일지는 고려 못 함 → '이모'를 번역하면 '아주머니'지만 친근함은 안 전해짐 → 기술과 경쟁하지 않고 기술을 활용해 상대에게 진짜 전해지는 형태를 생각하는 사람이 되고 싶어 배울 의미 있음", "kw": ["AI", "翻訳", "イモ", "親しさ", "技術"]}, {"id": 25, "q": "「やさしい日本語」について、知っていることを教えてください。", "a": "外国の人にも分かりやすいように、難しい言葉を簡単な言葉に言い換えたり、文を短くしたりした日本語です。阪神・淡路大震災のときに、日本語が十分に分からない外国の人に情報が届かなかったことがきっかけで、考えられたと聞きました。例えば「高台に避難してください」を「高いところに逃げてください」と言い換えるような工夫です。今は災害のときだけじゃなく、役所のお知らせなどでも使われるようになっています。", "type": "normal", "sum": "'쉬운 일본어'에 대해 아는 것", "asum": "외국인도 알기 쉽게 어려운 말을 쉬운 말로 바꾸고 문장을 짧게 한 일본어 → 한신·아와지 대지진 때 외국인에게 정보가 닿지 않은 것이 계기 → 예: '高台に避難' → '高いところに逃げて' → 지금은 재해뿐 아니라 관공서 공지에도 사용", "kw": ["言い換え", "簡単な言葉", "阪神", "高台", "避難"]}, {"id": 26, "q": "日本語の勉強で、一番苦労したことは何ですか。", "a": "会話は小さい頃から慣れていたんですが、漢字と、書き言葉の硬い表現には苦労しました。特に記述問題を書くとき、話し言葉と書き言葉の違いがなかなかつかめなくて。それで、毎朝授業の前に30分、漢字を手で書いて覚えることを続けてきました。続けているうちに文章を読むスピードも上がってきたので、入学してからもこの習慣は続けるつもりです。", "type": "normal", "sum": "일본어 공부에서 가장 힘들었던 점", "asum": "회화는 익숙했으나 한자와 딱딱한 문어체 표현이 어려움, 특히 서술형에서 구어·문어 구분 → 매일 아침 수업 전 30분 한자 손으로 쓰며 암기 → 읽는 속도도 늘어 입학 후에도 계속할 예정", "kw": ["漢字", "書き言葉", "毎朝", "30分", "手で書い"]}, {"id": 27, "q": "日本語コースには留学生が多いですが、日本人の学生と一緒の授業もあります。いろいろな学生とうまくやっていけそうですか。", "a": "はい、すごく楽しみです。小さい頃は日本の学校に通っていましたし、韓国でも日本の人との交流会によく参加してきたので、日本の人と話すことには慣れています。オーケストラでも、年齢も仕事も違う人たちと一つの音楽を作ってきました。日本と韓国の両方を知っているので、グループの中で「韓国ではこうだよ」という違う見方を出して、話し合いを広げる役ができると思います。", "type": "normal", "sum": "일본어코스에서 일본인 학생과 어울릴 수 있겠나", "asum": "네, 기대됨. 어릴 때 일본 학교 다녔고 한국에서도 일본인 교류회 참가 → 오케스트라에서도 다양한 사람과 음악을 만듦 → 한일 양쪽을 아는 사람으로서 '한국에서는 이래' 하는 다른 시각을 내 토론을 넓히는 역할", "kw": ["楽しみ", "日本の学校", "交流会", "オーケストラ", "韓国ではこうだよ"]}, {"id": 28, "q": "最近読んだ本で、印象に残っているものはありますか。", "a": "『嫌われる勇気』です。私は、嫌なことがあったり、人間関係がうまくいかなかったりすると、ずっとそのことを考えてしまうタイプでした。でもこの本で、「過去に何があったかで、今の自分が全部決まるわけじゃない」という考え方を知って、すごく気持ちが楽になりました。", "type": "normal", "sum": "최근 읽은 인상적인 책", "asum": "『미움받을 용기』 → 안 좋은 일이 있으면 계속 곱씹는 타입이었으나 '과거가 지금의 나를 전부 결정하지 않는다'는 생각을 알고 마음이 편해짐", "kw": ["嫌われる勇気", "過去", "気持ちが楽", "考え"]}, {"id": 29, "q": "（関連質問）その考え方を、実際の生活で生かしたことはありますか。", "a": "はい。例えば、テストの結果が思ったより悪かったときです。前の私なら、何がいけなかったんだろうとずっと落ち込んでいたと思います。でも今は、「じゃあ次までに何ができるか」を考えるようにしていて、そのときは苦手なところだけをノートにまとめて、毎日少しずつ見直しました。落ち込む時間が短くなって、すぐ行動に移せるようになったと思います。", "type": "normal", "sum": "(관련) 그 생각을 실제 생활에서 활용한 적", "asum": "시험을 못 봤을 때 예전엔 계속 낙담했으나 지금은 '다음까지 뭘 할 수 있나' 생각 → 약한 부분만 노트에 정리해 매일 조금씩 복습 → 낙담 시간이 짧아지고 바로 행동으로 옮김", "kw": ["テスト", "次までに", "苦手", "ノート", "落ち込む"]}, {"id": 30, "q": "大学では、勉強以外にどんなことをしたいですか。", "a": "フルートを6年間習っていて、地域のアマチュアオーケストラにも入っていたので、大学でもオーケストラを続けたいです。一人で吹くときと違って、オーケストラは自分の音を出しながら、周りの音もよく聞いて合わせないといけない。そこがすごく好きなんです。大学では新しい仲間と一緒に、また一つの音楽を作ってみたいです。", "type": "normal", "sum": "대학에서 공부 외에 하고 싶은 것", "asum": "플루트 6년, 지역 아마추어 오케스트라 경험 → 대학에서도 오케스트라 계속. 혼자 불 때와 달리 내 소리를 내며 주변 소리도 듣고 맞추는 점이 좋음 → 새 동료와 다시 하나의 음악을 만들고 싶음", "kw": ["フルート", "6年", "オーケストラ", "周りの音", "合わせ"]}, {"id": 31, "q": "京田辺キャンパスは京都の中心から少し離れていますが、住む場所や生活については考えていますか。", "a": "はい、キャンパスの近くに住もうと思っています。通学が楽なほうが、勉強にもオーケストラにも集中できると思うので。京都の中心へも電車で行けると聞いているので、休みの日にはお寺や町を歩いて、京都の文化にもたくさん触れたいです。", "type": "normal", "sum": "교타나베 캠퍼스 거주·생활 계획", "asum": "캠퍼스 근처에 살 계획(통학이 편해야 공부·오케스트라에 집중) → 교토 중심은 전철로 갈 수 있어 휴일에 절·거리를 걸으며 교토 문화를 접하고 싶음", "kw": ["キャンパスの近く", "通学", "電車", "お寺", "京都の文化"]}, {"id": 32, "q": "日本での一人暮らしで、心配なことはありますか。", "a": "料理です（笑）。韓国では家族と住んでいるので、毎日自分でご飯を作ったことはまだあまりなくて。今、週末に少しずつ練習しています。あとは、困ったときに相談できる人を早めに作りたいので、大学の留学生の窓口や、タンデム・パートナーの友達にも頼りながら生活していきたいです。", "type": "normal", "sum": "일본 자취 생활에서 걱정되는 점", "asum": "요리(웃음) → 한국에선 가족과 살아 매일 직접 밥한 적이 적음, 주말에 조금씩 연습 중 → 곤란할 때 상담할 사람을 일찍 만들고자 대학 유학생 창구·탠덤 파트너에게도 의지", "kw": ["料理", "週末", "練習", "留学生の窓口", "タンデム"]}, {"id": 33, "q": "最近、気になったニュースはありますか。", "a": "日本で暮らす外国の人が年々増えて、過去最多になっているというニュースです。私が住んでいた頃より、町で外国の人を見かけることがずっと多くなったと聞きました。人が増えれば、ごみの出し方や病院のかかり方など、「知らなかった」が原因で困る場面も増えると思います。ルールを守ってほしいと言うだけじゃなく、ちゃんと伝わる伝え方を考えることが、ますます大事になってくると感じました。", "type": "normal", "sum": "최근 신경 쓰인 뉴스", "asum": "일본 거주 외국인이 해마다 늘어 역대 최다라는 뉴스 → 쓰레기 배출·병원 이용 등 '몰랐다'로 인한 곤란이 늘 것 → 규칙을 지키라고만 하지 않고 제대로 전해지는 전달 방식을 고민하는 것이 더 중요해진다고 느낌", "kw": ["過去最多", "外国の人", "ごみの出し方", "病院", "伝え方"]}, {"id": 34, "q": "あなたの長所と短所を教えてください。", "a": "長所は、相手の立場に立って考えられるところです。動画を作ったときも、見る人が何を知らないかを一番に考えました。短所は、一つのことを気にしすぎてしまうところです。でも最近は、気になったら「今できることは何か」を考えて、すぐ動くようにしています。", "type": "normal", "sum": "장점과 단점", "asum": "장점: 상대 입장에서 생각 → 영상 제작 때도 보는 사람이 모르는 것을 최우선 고려. 단점: 한 가지를 지나치게 신경 씀 → 요즘은 '지금 할 수 있는 것'을 생각해 바로 움직임", "kw": ["相手の立場", "見る人", "気にしすぎ", "今できること"]}, {"id": 35, "q": "ストレス解消法や趣味はありますか。", "a": "フルートを吹くことです。好きな曲を思いきり吹くと、頭の中がすっきりします。あとは、音楽を聞きながら散歩するのも好きです。", "type": "normal", "sum": "스트레스 해소법·취미", "asum": "플루트 연주(좋아하는 곡을 마음껏 불면 머리가 맑아짐) + 음악 들으며 산책", "kw": ["フルート", "頭の中", "すっきり", "散歩"]}, {"id": 36, "q": "日本の少子高齢化について、知っていることを説明してください。", "a": "日本では生まれる子どもの数が年々減っていて、去年発表された数字では、一年に生まれる赤ちゃんが70万人を下回ったと聞きました。その一方で、お年寄りの割合はどんどん増えています。働く世代が減っているので、介護や建設、コンビニなど、いろいろな現場で人が足りなくなっています。それで、外国から来て働く人がここ数年でかなり増えていて、今では外国人の労働者が200万人を超えていると知りました。少子高齢化は、日本が外国の人と一緒に暮らす社会になっていく、大きなきっかけになっていると思います。", "type": "normal", "sum": "일본 저출산·고령화 설명", "asum": "출생아 수 감소(작년 70만 명 미만), 고령자 비율 증가 → 일하는 세대 감소로 간병·건설·편의점 등 인력 부족 → 외국인 노동자 증가(200만 명 초과) → 저출산·고령화가 외국인과 함께 사는 사회로 가는 큰 계기", "kw": ["少子高齢化", "70万人", "働く世代", "200万人", "一緒に暮らす"]}, {"id": 37, "q": "「多文化共生」という言葉を、どういう意味だと理解していますか。", "a": "国籍や文化が違う人たちが、お互いの違いを認め合って、対等な関係をつくりながら、同じ地域の一員として一緒に暮らしていく、という意味だと理解しています。大事なのは、外国の人が日本のやり方に合わせるだけでも、日本の人が我慢するだけでもなくて、お互いに歩み寄るところだと思います。そのためには、まず相手に伝わる言葉で話すことが、一番の入り口になるんじゃないかと考えています。", "type": "normal", "sum": "'다문화공생'의 이해", "asum": "국적·문화가 다른 사람들이 서로의 차이를 인정하고 대등한 관계로 같은 지역 구성원으로 함께 사는 것 → 외국인이 맞추기만, 일본인이 참기만 하는 것이 아니라 서로 다가가는 것 → 그 입구는 상대에게 통하는 말로 이야기하는 것", "kw": ["国籍", "認め合", "対等", "歩み寄", "お互い"]}, {"id": 38, "q": "（関連質問）では、多文化共生のために、地域ではどんな取り組みが行われていますか。", "a": "例えば、市役所に外国語で相談できる窓口があったり、ごみの出し方のルールを何か国語かのチラシにして配ったりしています。それから、ボランティアの人たちが開いている地域の日本語教室もあります。最近は、何か国語にも訳すだけじゃなくて、「やさしい日本語」でお知らせを出す自治体も増えていると聞きました。言葉の数を増やすより、一つの分かりやすい日本語でより多くの人に届ける、という考え方がおもしろいと思いました。", "type": "normal", "sum": "(관련) 다문화공생을 위한 지역 활동", "asum": "시청의 외국어 상담 창구, 여러 언어 쓰레기 배출 안내 전단, 자원봉사 일본어 교실 → 최근엔 번역 대신 '쉬운 일본어' 공지를 쓰는 지자체도 증가 → 말의 수보다 하나의 알기 쉬운 일본어로 더 많은 사람에게 닿는다는 발상이 흥미로움", "kw": ["相談", "窓口", "チラシ", "日本語教室", "やさしい日本語"]}, {"id": 39, "q": "日本語の敬語は、外国の人にとって難しいと言われます。韓国語の敬語と比べて、どんな違いがありますか。", "a": "一番大きな違いは、「誰に話しているか」で変わるところだと思います。韓国語では、自分の親や会社の上司のことは、外の人に話すときでも敬語を使います。でも日本語だと、外の人に話すときは、自分の会社の部長のことでも「部長の田中は席を外しております」のように、敬語を使わずに言いますよね。相手との関係によって、同じ人への言い方が変わるので、韓国の人にとってはそこが特に難しいと思います。", "type": "normal", "sum": "일본어 경어와 한국어 경어의 차이", "asum": "'누구에게 말하느냐'에 따라 달라짐. 한국어는 부모·상사를 외부인에게 말해도 경어를 쓰지만 일본어는 외부에 자기 회사 부장을 말할 땐 경어를 안 씀('部長の田中は席を外しております') → 상대와의 관계로 같은 사람 표현이 바뀌어 한국인에게 특히 어려움", "kw": ["誰に話している", "外の人", "部長", "敬語", "田中"]}, {"id": 40, "q": "外国人労働者の受け入れについて、日本の制度で知っていることはありますか。", "a": "人手が足りない分野で、外国の人が働けるようにする「特定技能」という制度があると知っています。それから、技能実習制度は、働く人の権利が守られていないという問題が指摘されていて、新しく「育成就労」という制度に変わることが決まったと聞きました。制度が変わっても、実際に働く人が仕事のルールや自分の権利をきちんと理解できなければ意味がないので、そこでも「どう伝えるか」が大事になると思います。", "type": "normal", "sum": "외국인 노동자 수용 제도", "asum": "인력 부족 분야에서 일할 수 있게 하는 '특정기능' 제도 + 권리 보호 문제가 지적된 기능실습제도가 '육성취로'로 바뀌게 됨 → 제도가 바뀌어도 일하는 사람이 규칙·권리를 이해하지 못하면 의미 없어 '어떻게 전할까'가 중요", "kw": ["特定技能", "技能実習", "育成就労", "権利", "伝える"]}, {"id": 41, "q": "日本はハイコンテクストな文化だと言われますが、どういう意味か分かりますか。", "a": "はい、言葉ではっきり言わなくても、その場の空気や、お互いが共有している前提で意味が伝わる文化、という意味だと思います。例えば、何かをすすめられて「結構です」と言うとき、「いいです」なのか「いりません」なのかは、言葉だけでは分からなくて、言い方や表情で判断しますよね。日本人同士なら自然に分かっても、前提を共有していない外国の人には伝わりにくいので、そういうときこそ言葉で補う工夫が必要だと思います。", "type": "normal", "sum": "'하이컨텍스트 문화'의 의미", "asum": "말로 분명히 안 해도 분위기·공유한 전제로 뜻이 전해지는 문화 → 예: 권유에 '結構です'가 '좋아요'인지 '필요 없어요'인지 말투·표정으로 판단 → 전제를 공유하지 않는 외국인에겐 안 통하므로 말로 보충하는 노력이 필요", "kw": ["空気", "共有", "結構です", "言葉で補", "外国の人"]}, {"id": 42, "q": "京都では観光客が増えすぎることが問題になっていますが、どう思いますか。", "a": "観光客が増えるのは町にとってうれしいことですが、バスが混んで地元の人が乗れなかったり、私有地に入って写真を撮る人がいたりして、住んでいる人の生活に影響が出ていると聞きました。私は、ルールを守らない人の中には、悪気はなくて、ただルールを知らないだけの人も多いと思うんです。だから、禁止の看板を増やすだけじゃなく、なぜだめなのかが一目で分かる絵や、やさしい言葉で伝えることも大事だと思います。", "type": "normal", "sum": "교토 오버투어리즘에 대한 생각", "asum": "관광객 증가는 반갑지만 버스 혼잡·사유지 침입 촬영 등 주민 생활에 영향 → 악의 없이 규칙을 몰라서인 경우도 많음 → 금지 간판만 늘리지 말고 왜 안 되는지 한눈에 알 그림·쉬운 말로 전하는 것이 중요", "kw": ["観光客", "バス", "私有地", "ルール", "絵"]}, {"id": 43, "q": "日本のアニメやマンガが海外で人気がある理由は、何だと思いますか。", "a": "一つは、ジャンルがとても幅広いことだと思います。スポーツも恋愛も仕事の話もあって、どんな年齢の人でも自分に合う作品が見つかります。もう一つは、ネットの配信で、世界中の人がほぼ同時に見られるようになったことです。韓国でも、私の周りの友達は日本のアニメをきっかけに日本語を勉強し始めた人が多いです。作品の中の食べ物や学校生活を通して、日本の文化そのものに興味を持つ入り口になっていると感じます。", "type": "normal", "sum": "일본 const KNUM = {"〇":"0","一":"1","二":"2","三":"3","四":"4","五":"5","六":"6","七":"7","八":"8","九":"9","十":"10"};
function normChars(s){

    for(let ch of s[i].normalize("NFKC").toLowerCase()){

      for(const c2 of ch){ if(/[\p{L}\p{N}\p{M}]/u.test(c2)) out.push({ch:c2, idx:i}); }
    }
  }
  return out;
}
const normStr = s => normChars(s).map(o=>o.ch).join("");

function lcsPairs(a,b){
  const n=a.length,m=b.length,w=m+1,dp=new Uint16Array((n+1)*w);
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)
    dp[i*w+j]= a[i-1]===b[j-1] ? dp[(i-1)*w+j-1]+1 : Math.max(dp[(i-1)*w+j],dp[i*w+j-1]);
  const pairs=[]; let i=n,j=m;
  while(i>0&&j>0){
    if(a[i-1]===b[j-1]){pairs.push([i-1,j-1]);i--;j--;}
    else if(dp[(i-1)*w+j]>=dp[i*w+j-1]) i--; else j--;
  }
  return pairs.reverse();
}
function slice(orig, nc, from, to){ // nc: normChars, [from,to] 정규화 인덱스(포함) → 원문 조각
  if(from>to) return "";
  return orig.slice(nc[from].idx, nc[to].idx+1).trim();
}
function analyze(script, heard){
  const A=normChars(script), B=normChars(heard);
  const a=A.map(o=>o.ch), b=B.map(o=>o.ch);
  const pairs = (a.length&&b.length) ? lcsPairs(a,b) : [];
  const L=pairs.length;
  const matched=new Set(pairs.map(p=>A[p[0]].idx));
  const bad=new Set(); A.forEach((o,i)=>{ if(!pairs.some(p=>p[0]===i)) bad.add(o.idx); });
  const ops=[]; let pi=-1,pj=-1;
  const pts=pairs.concat([[a.length,b.length]]);
  for(const [ni,nj] of pts){
    const gs=[pi+1,ni-1], gt=[pj+1,nj-1];
    const sTxt=slice(script,A,gs[0],gs[1]), tTxt=slice(heard,B,gt[0],gt[1]);
    if(sTxt&&tTxt) ops.push({t:"sub",s:sTxt,h:tTxt});
    else if(sTxt) ops.push({t:"miss",s:sTxt});
    else if(tTxt && B.slice(gt[0],gt[1]+1).length>=2) ops.push({t:"extra",h:tTxt});
    pi=ni; pj=nj;
  }
  const coverage = a.length ? L/a.length : 0;
  const dice = (a.length+b.length) ? 2*L/(a.length+b.length) : 0;
  // 대본 글자별 오류 표시 (원문 인덱스)
  return {ops, bad:[...bad], coverage, dice, readScore:Math.round(100*(0.7*coverage+0.3*dice)), hLen:b.length};
}
function bigrams(s){ const set=new Set(); for(let i=0;i<s.length-1;i++) set.add(s.slice(i,i+2)); return set; }
function memoScore(q, script, heard){
  const hn=normStr(heard);
  const groups=(q.kw||[]).map(k=>Array.isArray(k)?k:[k]);
  const missKw=[], hitKw=[];
  groups.forEach(g=>{ (g.some(x=>hn.includes(normStr(x))) ? hitKw : missKw).push(g[0]); });
  const sb=bigrams(normStr(script)), hb=bigrams(hn);
  let hit=0; sb.forEach(x=>{ if(hb.has(x)) hit++; });
  const bg = sb.size? hit/sb.size : 0;
  const kw = groups.length ? hitKw.length/groups.length : bg;
  return {score:Math.round(100*(0.7*kw+0.3*bg)), missKw, hitKw};
}
function evaluate(q, heard, phase, passScore){
  const script=scriptOf(q);
  const an=analyze(script, heard);
  let score, missKw=[], hitKw=[];
  if(phase==="read"){ score=an.readScore; }
  else { const m=memoScore(q,script,heard); score=m.score; missKw=m.missKw; hitKw=m.hitKw; }
  const pass = score >= passScore;
  return {score, pass, ops:an.ops, bad:an.bad, missKw, hitKw, hLen:an.hLen};
}
function scriptHtml(script, badIdx){
  const bad=new Set(badIdx||[]);
  return [...script].map((c,i)=> bad.has(i) ? '<span class="bad">'+esc(c)+'</span>' : esc(c)).join("");
}

let ac=null;
function unlockAudio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }catch(e){} }
function beep(freq=880, ms=320){
  return new Promise(res=>{
    try{
      unlockAudio();
      const o=ac.createOscillator(), g=ac.createGain();
      o.type="sine"; o.frequency.value=freq; g.gain.value=0.2;
      o.connect(g); g.connect(ac.destination); o.start();
      setTimeout(()=>{ try{o.stop();}catch(e){} res(); }, ms);
    }catch(e){ res(); }
  });
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let ttsBusy=false, ttsOn=true;
// 일본어 음성 선택: 부자연스러운 음성(맥의 Eddy/Reed 등 다국어 음성)은 피하고 자연스러운 음성을 우선
const BAD_VOICE=/Eddy|\bFlo\b|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Zarvox|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Albert|Fred|Junior|Kathy|Ralph|Princess/i;
const GOOD_VOICE=[[/Natural|Online/i,60],[/Nanami|Keita|Ayumi|Haruka|Sayaka|Ichiro/i,40],[/Google/i,35],[/Kyoko|Otoya|O-?Ren|Hattori/i,30]];
function jaVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang)); }catch(e){ return []; } }
function voiceScore(v){
  let s=0; if(BAD_VOICE.test(v.name)) s-=100;
  GOOD_VOICE.forEach(([re,w])=>{ if(re.test(v.name)) s+=w; });
  if(/enhanced|premium|プレミアム|拡張/i.test(v.name+" "+v.voiceURI)) s+=10;
  return s;
}
function pickVoice(){
  const list=jaVoices(); if(!list.length) return null;
  if(S.profile.voice){ const f=list.find(v=>v.name===S.profile.voice); if(f) return f; }
  return list.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
}
const jaVoice = pickVoice;
function ttsReady(){ return ttsOn && "speechSynthesis" in window && !!pickVoice(); }
function speakAsync(text){
  return new Promise(res=>{
    if(!ttsOn || !("speechSynthesis" in window)){ res(); return; }
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text); u.lang="ja-JP"; u.rate=0.95; u.pitch=1;
      const v=pickVoice(); if(v) u.voice=v;
      ttsBusy=true; let fin=false;
      const end=()=>{ if(fin) return; fin=true; ttsBusy=false; res(); };
      u.onend=end; u.onerror=end; setTimeout(end,30000);

/* ===== 마이크 ===== */
let micOk=false, lastMicErr=null;
async function ensureMic(){
  if(micOk) return true;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true; // 판단 불가 → 인식기에 맡김
  try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); st.getTracks().forEach(t=>t.stop()); micOk=true; lastMicErr=null; return true; }
  catch(e){ lastMicErr=e; return false; }
}
function micAdvice(code){
  const blocked="마이크가 차단되어 있어요. 주소창 왼쪽 자물쇠(또는 마이크) 아이콘 → 마이크 '허용' → 새로고침 해 주세요. 그래도 안 되면 PC 설정 → 개인정보 → 마이크에서 Chrome(Edge)을 허용하세요. 미리보기 창이나 카카오톡 같은 앱 안에서 열었다면 Chrome에서 파일을 직접 열어야 해요.";
  if(/NotAllowed|Security|PermissionDenied|not-allowed/.test(code||"")) return blocked;
  if(/service-not-allowed/.test(code||"")) return "이 브라우저가 음성인식 서비스를 허용하지 않아요. PC 또는 안드로이드의 Chrome / Edge에서 열어 주세요.";
  if(/NotFound|audio-capture|DevicesNotFound/.test(code||"")) return "마이크 장치를 찾을 수 없어요. 마이크(이어폰)가 연결되어 있는지 확인해 주세요.";
  if(/NotReadable|TrackStart/.test(code||"")) return "다른 프로그램(Zoom, Teams 등)이 마이크를 쓰고 있어요. 그 프로그램을 끄고 다시 시도해 주세요.";
  if(/network/.test(code||"")) return "음성인식 서버(구글)에 연결되지 않아요. 인터넷 연결을 확인하고, 학원/회사 네트워크라면 다른 네트워크(휴대폰 핫스팟)를 써 보세요. Edge에서 계속 안 되면 Chrome으로 열어 보세요.";
  if(/language-not-supported/.test(code||"")) return "이 브라우저가 일본어 음성인식을 지원하지 않아요.";
  return "마이크/음성인식 오류가 발생했어요 ("+(code||"알 수 없음")+"). '마이크 진단'을 실행해 보세요.";
}

/* ===== 음성 인식 엔진 =====
   - 질문마다 인식기를 새로 켜고, '듣는 중'임을 확인한 뒤에 비프를 울려요. → 질문 음성이 답변에 섞이지 않고, 비프 직후 첫마디부터 인식돼요.
   - 켜는 순간 접속 오류(network)가 나면 자동으로 다시 시도해요. 답변 도중 끊겨도 자동으로 다시 이어요.
   - 마이크는 훈련 내내 열어 두고(허용 창 최소화), 같은 마이크 신호로 '말이 끊긴 시간'을 직접 재서 자동 종료해요. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const GRACE_MS = 1000;      // 답변 종료 후 마지막 인식 결과를 기다리는 최대 시간
const NET_MAX = 3;          // 접속 오류 자동 재시도 횟수
let eng=null, engLive=false, engBoot=false, engArmed=false, engErr="", engNet=0, holdStream=null, win=null, timer=null;
let micName="", micNote="", lastReopen=0, dcT=null;
const vad={an:null, src:null, buf:null, hist:[], t:null, alive:false, th:0.015, level:0};

function vadStart(){
  if(vad.t||!holdStream) return;
  try{
    unlockAudio(); if(!ac) return;
    vad.src=ac.createMediaStreamSource(holdStream); vad.an=ac.createAnalyser(); vad.an.fftSize=1024;
    vad.src.connect(vad.an); vad.buf=new Float32Array(vad.an.fftSize); vad.hist=[]; vad.alive=false;
    vad.t=setInterval(vadTick,100);
  }catch(e){ vad.an=null; }
}
function vadStop(){ clearInterval(vad.t); vad.t=null; try{ vad.src&&vad.src.disconnect(); }catch(e){} vad.src=null; vad.an=null; vad.alive=false; }
function vadTick(){
  const a=vad.an; if(!a) return;
  a.getFloatTimeDomainData(vad.buf); let sum=0; for(let i=0;i<vad.buf.length;i++) sum+=vad.buf[i]*vad.buf[i];
  const rms=Math.sqrt(sum/vad.buf.length);
  if(rms>0.0003) vad.alive=true;
  vad.hist.push(rms); if(vad.hist.length>100) vad.hist.shift();
  const so=vad.hist.slice().sort((x,y)=>x-y), floor=so[Math.floor(so.length*0.15)]||0;
  vad.th=Math.max(0.015, floor*3); vad.level=rms;
  const lv=document.getElementById('lvl'); if(lv) lv.style.width=Math.min(100,Math.round(rms*500))+'%';
  if(rms>vad.th && win && win.on && !win.closing){ win.lastVoice=Date.now(); win.voiceMs=(win.voiceMs||0)+100; }
}

async function armMic(){
  engArmed=true; engErr="";
  if(!isMobile && !holdStream && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    try{ holdStream=await navigator.mediaDevices.getUserMedia({audio:true}); micOk=true; lastMicErr=null; }   // 마이크를 훈련 내내 열어 둠(데스크톱)
    catch(e){ lastMicErr=e; return false; }
  } else if(!holdStream && !(await ensureMic())) return false;
  const tr=holdStream&&holdStream.getAudioTracks()[0];
  if(tr){ micName=tr.label||micName; tr.onended=()=>{ if(holdStream&&engArmed){ holdStream=null; onMicLost("마이크 연결이 끊겼어요."); } }; }
  vadStart();
  return true;
}
// 마이크 장치를 다시 인식(이어폰/헤드셋을 꽂거나 뺐을 때)
async function reopenMic(){
  lastReopen=Date.now();
  vadStop(); killEngine();
  if(holdStream){ holdStream.getTracks().forEach(t=>{ t.onended=null; t.stop(); }); holdStream=null; }
  micOk=false;
  const ok=await armMic();
  if(ok && win && win.on && !win.closing && !eng) startEngine();     // 답변 중이었다면 새 마이크로 인식기를 다시 켬
  return ok;
}
async function onMicLost(why){
  micNote=(why||"마이크 장치가 바뀌었어요.")+" 다시 연결 중…"; if(view==="session") render();
  const ok=await reopenMic();
  micNote= ok ? "✔ 마이크를 다시 인식했어요: "+(micName||"기본 마이크")+(win&&win.on?"":" (▶를 눌러 계속하세요)") : micAdvice(lastMicErr&&lastMicErr.name);
  if(view==="session"||view==="setup") render();
}
if(navigator.mediaDevices && navigator.mediaDevices.addEventListener){
  navigator.mediaDevices.addEventListener("devicechange",()=>{
    if(!engArmed || !holdStream) return;
    clearTimeout(dcT); dcT=setTimeout(()=>{ if(Date.now()-lastReopen>3000) onMicLost("마이크 장치가 바뀌었어요."); },700);
  });
}
function killEngine(){
  const r=eng; eng=null; engLive=false; engBoot=false;
  if(r){ r.onend=r.onerror=r.onresult=r.onaudiostart=null; try{ r.abort(); }catch(e){} }
}
function disarmMic(){
  engArmed=false; clearInterval(timer);
  if(win){ win.on=false; win=null; }
  killEngine(); vadStop();
  if(holdStream){ holdStream.getTracks().forEach(t=>t.stop()); holdStream=null; }
}
function engFail(){ if(win&&win.on&&!win.closing){ win.err=engErr; stopRec(); } }
function startEngine(){
  if(!SR || eng) return;
  engBoot=true; engLive=false;
  const r=new SR(); eng=r; r.lang="ja-JP"; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
  r.onaudiostart=()=>{ if(eng===r){ engLive=true; engBoot=false; } };
  r.onresult=e=>{
    if(eng!==r) return;
    engNet=0;
    if(!win||!win.on) return;
    win.interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const x=e.results[i];
      if(x.isFinal) win.chunks.push({t:x[0].transcript, c:x[0].confidence, at:Date.now()});
      else win.interim+=x[0].transcript;
    }
    const txt=win.chunks.map(c=>c.t).join(" ")+" "+win.interim;
    if(txt.trim()){ win.hasSpeech=true; win.lastAct=Date.now(); }
    const el=$("#live"); if(el&&!win.closing) el.textContent=txt;
  };
  r.onerror=e=>{
    if(eng!==r) return;
    const c=e.error;
    if(c==="no-speech"||c==="aborted") return;
    if(c==="network"){ engNet++; if(engNet>=NET_MAX){ engErr=micAdvice("network"); engFail(); } return; }   // 일시적 접속 오류는 자동 재시도
    engErr=micAdvice(c); engFail();
  };
  r.onend=()=>{
    if(eng!==r) return;
    eng=null; engLive=false; engBoot=false;
    if(win&&win.on){
      if(win.closing){ finishRec(win); return; }
      if(engArmed&&!engErr) setTimeout(()=>{ if(win&&win.on&&!win.closing&&!eng) startEngine(); }, engNet?500:30);   // 답변 중 끊기면 곧바로 다시 켬
    }
  };
  try{ r.start(); }catch(e){ eng=null; engBoot=false; }
}
// 새 인식기를 켜고 '듣는 중' 확인. 켜자마자 접속 오류가 나면 자동 재시도
async function freshEngine(){
  if(!SR||!engArmed) return false;
  for(let k=0;k<NET_MAX;k++){
    killEngine(); engErr=""; engNet=0;
    startEngine();
    const t0=Date.now(); let up=false;
    while(Date.now()-t0<6000){ if(engErr) return false; if(engLive){ up=true; break; } if(!eng) break; await sleep(40); }
    if(up){
      const t1=Date.now();
      while(Date.now()-t1<500){ if(!eng||engNet>0||engErr) break; await sleep(40); }   // 켜진 직후 오류 여부 확인
      if(engErr) return false;
      if(eng&&engLive&&!engNet) return true;
    }
    await sleep(300);
  }
  engErr=micAdvice("network"); return false;
}
function echoLike(chunk, q){   // 면접관 질문이 스피커로 들어와 인식된 조각인지
  const a=normStr(q), b=normStr(chunk);
  if(!a||b.length<5) return false;
  return lcsPairs(a,b).length/b.length>=0.7;
}
function startRec(done, opt){
  const o=Object.assign({silence:SILENCE_MS, noSpeech:NOSPEECH_MS, max:180000, autoStop:true, q:""}, opt||{});
  clearInterval(timer);
  win={on:true, closing:false, cb:done, start:Date.now(), lastAct:Date.now(), lastVoice:0, voiceMs:0, hasSpeech:false, chunks:[], interim:"", q:o.q, opt:o, err:""};
  if(engArmed && !eng) startEngine();
  timer=setInterval(()=>{
    const w=win; if(!w||!w.on) return;
    const now=Date.now();
    const idle=now-Math.max(w.start, w.lastAct||0, w.lastVoice||0);   // 인식 결과도 마이크 소리도 없던 시간
    const speech=w.hasSpeech||w.voiceMs>=300;
    const el=$("#timer"); if(el) el.textContent=Math.round((now-w.start)/1000)+"초 · 조용한 시간 "+Math.floor(idle/1000)+"초";
    if(w.closing) return;
    if(now-w.start>o.max) stopRec();
    else if(o.autoStop && speech && idle>o.silence) stopRec();
    else if(o.autoStop && !speech && idle>o.noSpeech) stopRec();
  },250);
}
function stopRec(){
  const w=win; if(!w||!w.on||w.closing) return;
  w.closing=true; w.stopAt=Date.now();
  try{ eng&&eng.stop(); }catch(e){}            // 마지막 인식 결과를 내보내게 한 뒤 종료(onend에서 마무리)
  setTimeout(()=>finishRec(w), GRACE_MS);
}
function abortRec(){ clearInterval(timer); if(win){ win.on=false; win=null; } killEngine(); }
function finishRec(w){
  if(!w||w!==win||!w.on) return;
  clearInterval(timer); w.on=false; win=null;
  killEngine();
  const early=c=>(c.at-w.start)<2500 && w.q && echoLike(c.t,w.q);
  const kept=w.chunks.filter(c=>!early(c));
  const parts=kept.map(c=>c.t.trim()).filter(Boolean);
  const it=w.interim.trim(); if(it && !(w.q && (Date.now()-w.start)<2500 && echoLike(it,w.q))) parts.push(it);
  const low=kept.filter(c=>c.c>0&&c.c<0.75).map(c=>c.t.trim()).filter(Boolean);
  const text=parts.join(" ").trim();
  w.cb({text, low, dur:((w.stopAt||Date.now())-w.start)/1000, err: text ? "" : (w.err||engErr)});
}
window.addEventListener("beforeunload",()=>{ try{ disarmMic(); }catch(e){} });

/* ===== 질문 선택: 회차당 15문항, 꼬리질문 연결, 5회 안에 전체 질문 1회 이상 ===== */
const _autoFollow={};
function followOf(id){
  if(C.follow && C.follow[id] && C.follow[id].length) return C.follow[id];
  if(!_autoFollow[id]){ // 지정이 없으면 질문+답안의 내용 유사도로 연결
    const bg=q=>bigrams(normStr(q.q+scriptOf(q)));
    const me=bg(qById(id)), first=C.questions[0].id;
    const sc=C.questions.filter(q=>q.id!==id&&q.id!==first).map(q=>{ const o=bg(q); let i=0; me.forEach(x=>{ if(o.has(x)) i++; }); return {id:q.id, s:i/((me.size+o.size-i)||1)}; }).sort((a,b)=>b.s-a.s);
    _autoFollow[id]=sc.slice(0,3).filter(x=>x.s>0.06).map(x=>x.id);
  }
  return _autoFollow[id];
}
function weakScore(id){ const s=[]; S.done.forEach(d=>d.results.forEach(r=>{ if(r.id===id) s.push(r.score); })); return s.length? s.reduce((a,b)=>a+b,0)/s.length : 50; }
function pickWeak(arr){ return arr.slice().sort((a,b)=>(weakScore(a)-weakScore(b))+(Math.random()-0.5)*12)[0]; }
function buildQueue(n){
  const ids=poolQs().map(q=>q.id), first=ids[0], others=ids.slice(1);
  const want=SESSION_SIZE-1, b=blockStart(n), left=BLOCK-(n-b);
  const wasSeen=new Set([first]);
  S.done.filter(d=>blockStart(d.n)===b).forEach(d=>(d.queue||[]).forEach(id=>wasSeen.add(id)));
  const unseen=others.filter(id=>!wasSeen.has(id)), seenO=others.filter(id=>wasSeen.has(id));
  let newQ=Math.min(want, Math.ceil(unseen.length/left));       // 이번 회차에 처음 만나는 질문 수
  if(seenO.length < want-newQ) newQ=Math.min(unseen.length, want-seenO.length);
  const repQ=want-newQ;                                           // 복습(이미 나온) 질문 수 — 점수 낮은 것 우선
  const list=[first], used=new Set([first]); let nn=0, nr=0;
  const ok=id=>!used.has(id) && (wasSeen.has(id) ? nr<repQ : nn<newQ);
  const take=id=>{ used.add(id); list.push(id); if(wasSeen.has(id)) nr++; else nn++; return id; };
  let cur=first;
  while(list.length<want+1){
    const f=followOf(cur).filter(ok);                              // 꼬리질문 우선
    if(f.length){ cur=take(f[Math.floor(Math.random()*Math.min(2,f.length))]); continue; }
    const cn=others.filter(id=>ok(id)&&!wasSeen.has(id)), cr=others.filter(id=>ok(id)&&wasSeen.has(id));
    if(!cn.length && !cr.length) break;
    const remN=newQ-nn, remR=repQ-nr;
    const useNew = cn.length && (!cr.length || Math.random() < remN/(remN+remR));
    cur=take(useNew ? cn[Math.floor(Math.random()*cn.length)] : pickWeak(cr));
  }
  others.filter(id=>!used.has(id)).forEach(id=>{ if(list.length<want+1) take(id); });   // 안전장치
  const cl=list.find(id=>{ const q=qById(id); return q&&q.closing; });   // '마지막으로 하고 싶은 말' 같은 마무리 질문은 항상 맨 끝
  if(cl!=null && list[list.length-1]!==cl){ list.splice(list.indexOf(cl),1); list.push(cl); }
  return list;
}

/* ===== 세션 흐름 ===== */
let setupErr="", view = "dash", prevView="dash", reportN = null, qs = {mode:"ready", att:null, hints:0, typed:false, replays:0}, resetAsk=false, micTest=null, diag=null, flowId=0;
const freshQs = () => ({mode:"ready", att:null, hints:0, typed:false, replays:0, err:""});

function startSession(){
  if(!setupOk()){ view="setup"; render(); return; }
  unlockAudio();
  if(!S.cur){
    const n=S.done.length+1;
    S.cur={n, phase:phaseOf(n), pass:passFor(n), startedAt:Date.now(), queue:buildQueue(n), idx:0, res:{}, recSec:0, greeted:false, empties:0};
    save();
  }
  view="session"; qs=freshQs(); flowId++;
  render();
  if(!S.cur.greeted) speakAsync(C.greeting);
}
function curQ(){ return qById(S.cur.queue[S.cur.idx]); }

// 질문(음성) → 비프 → 녹음. 읽기: 재생 버튼을 눌렀을 때, 암기: 자동 반복
async function askAndRecord(q, opt){
  opt=opt||{};
  const my=++flowId; unlockAudio(); qs.err=""; qs.diag=false; engErr=""; micNote="";
  const ok=await armMic(); if(my!==flowId) return;
  if(!ok){ qs.mode="ready"; qs.err=micAdvice(lastMicErr&&lastMicErr.name); qs.diag=true; render(); return; }
  if(opt.tts!==false){
    qs.mode="ask"; render();
    await speakAsync(q.q); if(my!==flowId) return;
    await sleep(350); if(my!==flowId) return;       // 스피커 잔향이 사라진 뒤에 인식기를 켬(질문이 답변에 섞이지 않게)
  }
  if(SR){
    qs.mode="prep"; render();
    const live=await freshEngine(); if(my!==flowId) return;   // 듣는 중임을 확인한 뒤에 비프
    if(!live){ qs.mode="ready"; qs.err=engErr||micAdvice("network"); qs.diag=true; render(); return; }
  }
  qs.mode="beep"; render(); await beep(); if(my!==flowId) return;
  qs.mode="rec"; render();
  const memo = S.cur.phase==="memo";
  startRec(r=>{ if(my===flowId) onAnswer(q,r); }, {silence: memo?SILENCE_MS:SILENCE_MS+2000, noSpeech:NOSPEECH_MS, q:q.q});
}

function onAnswer(q, r){
  const cur=S.cur, ph=cur.phase;
  if(r.err){ qs.mode="ready"; qs.err=r.err; qs.diag=true; render(); return; }
  const hn=normStr(r.text), empty = hn.length<3;
  if(empty && ph==="read"){ qs.mode="ready"; qs.err="음성이 인식되지 않았어요. 마이크를 확인하고 조금 더 크게 말해 주세요."; render(); return; }
  cur.recSec += r.dur;
  const heard = empty ? "" : r.text;
  const ev=evaluate(q, heard, ph, cur.pass);
  const prev=cur.res[q.id] || {tries:0, firstScore:null, hints:0, replays:0};
  const rate = r.dur>1 ? ev.hLen/r.dur : 0, scriptRate = (ph==="read" && r.dur>2) ? normStr(scriptOf(q)).length/r.dur : 0;
  const att={...ev, heard, low:r.low, dur:r.dur, typed:qs.typed, noAnswer:empty, rate:Math.round(rate*10)/10, fast:(rate>=8||scriptRate>=9)};
  const tries=prev.tries+1;
  const best = (!prev.best || att.score>=prev.best.score) ? att : prev.best;
  cur.res[q.id]={id:q.id, tries, firstScore: prev.firstScore==null?att.score:prev.firstScore, best, last:att,
                 hints:(prev.hints||0)+(qs.hints||0), replays:(prev.replays||0)+(qs.replays||0), done:false,
                 atts:(prev.atts||[]).concat([{score:att.score, bad:att.bad, ops:att.ops.filter(o=>o.t!=="extra"), low:att.low}])};
  qs.hints=0; qs.replays=0;
  const res=cur.res[q.id];
  res.done = ph==="memo" ? true : (best.pass || tries>=MAX_TRIES);
  res.flagged = !best.pass;
  qs.att=att; save();
  if(ph==="memo"){
    cur.empties = empty ? (cur.empties||0)+1 : 0;
    qs.mode="saved"; qs.hold = cur.empties>=3; save(); render();
    if(!qs.hold){ const my=flowId; setTimeout(()=>{ if(my===flowId && view==="session" && S.cur) nextQuestion(); }, 1300); }
  } else { qs.mode="fb"; render(); }
}

function nextQuestion(){
  const cur=S.cur;
  stopSpeak();
  if(cur.idx+1>=cur.queue.length){ finishSession(); return; }
  cur.idx++; cur.empties = cur.empties||0; save(); qs=freshQs();
  render();
  if(cur.phase==="memo") askAndRecord(curQ());
}

function finishSession(){
  const cur=S.cur;
  const results=cur.queue.map(id=>{
    const r=cur.res[id]; const q=qById(id);
    return {id, q:q.q, script:scriptOf(q), kw:q.kw, tries:r.tries, firstScore:r.firstScore, score:r.best.score, pass:r.best.pass,
            heard:r.best.heard, ops:r.best.ops, bad:r.best.bad, missKw:r.best.missKw, hitKw:r.best.hitKw, low:r.best.low, hints:r.hints, replays:r.replays||0, atts:r.atts, typed:r.best.typed, noAnswer:!!r.best.noAnswer, flagged:r.flagged};
  });
  const rec={n:cur.n, phase:cur.phase, passScore:cur.pass, queue:cur.queue, startedAt:cur.startedAt, endedAt:Date.now(), recSec:Math.round(cur.recSec), results,
    passCount:results.filter(r=>r.pass).length, total:results.length,
    avg:Math.round(results.reduce((a,r)=>a+r.score,0)/results.length),
    hints:results.reduce((a,r)=>a+r.hints,0), replays:results.reduce((a,r)=>a+r.replays,0), typed:results.some(r=>r.typed)};
  S.done.push(rec); S.cur=null; disarmMic();
  // 10회차 관문: 평균이 기준 미달이면 6~10회를 다시 진행(1회). 재도전 후에도 미달이면 리포트 우선 제출
  if(S.done.length>=total()){
    const okGate = rec.avg>=GATE_SCORE;
    if(okGate || (S.extra||0)>=MAX_EXTRA_BLOCKS){ rec.gate={avg:rec.avg, passed:okGate, added:false}; }
    else { S.extra=(S.extra||0)+1; rec.gate={avg:rec.avg, passed:false, added:true}; }
  }
  save();
  reportN=rec.n;
  view = (S.done.length>=total()) ? "complete" : "report"; render();
}

/* ===== 리포트(선생님 제출용) ===== */
function hash(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(36).toUpperCase().padStart(7,"0"); }
function doneCode(){
  const base=S.done.map(d=>[d.n,d.startedAt,d.endedAt,d.avg,d.passCount].join(",")).join("|")+C.student;
  const c=(hash(base)+hash(base.split("").reverse().join(""))).slice(0,8); return c.slice(0,4)+"-"+c.slice(4);
}
/* ===== 통계 / 리포트 ===== */
const avgOf = a => a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length) : null;
const sumQ = q => q.sum || (q.q.length>34 ? q.q.slice(0,34)+"…" : q.q);
const sumA = q => q.type==="custom" ? "(학생 작성) "+(S.profile.other||"").slice(0,90) : (q.asum || (scriptOf(q).slice(0,70)+"…"));
const clip = (s,n) => { s=(s||"").replace(/\s+/g," ").trim(); return s.length>n ? s.slice(0,n)+"…" : s; };
const stageLabel = d => d.n>BASE_TOTAL ? "재도전" : (d.phase==="read"?"읽기":"암기");
function lastGate(){ const g=S.done.slice().reverse().find(d=>d.gate); return g ? Object.assign({n:g.n}, g.gate) : null; }

function qStats(){
  const m={};
  C.questions.forEach(q=>{ m[q.id]={id:q.id, n:0, scores:[], read:[], memo:[], fail:0, lastHeard:"", lastMemoHeard:"", lowAtt:0, atts:0}; });
  S.done.forEach(d=>d.results.forEach(r=>{
    const x=m[r.id]; if(!x) return;
    x.n++; x.scores.push(r.score); (d.phase==="read"?x.read:x.memo).push(r.score);
    if(!r.pass) x.fail++;
    if(r.heard){ x.lastHeard=r.heard; if(d.phase==="memo") x.lastMemoHeard=r.heard; }
    (r.atts||[]).forEach(a=>{ x.atts++; if(a.low&&a.low.length) x.lowAtt++; });
  }));
  return Object.values(m).filter(x=>x.n).map(x=>{
    x.avg=avgOf(x.scores); x.avgRead=avgOf(x.read); x.avgMemo=avgOf(x.memo);
    x.key = x.avgMemo!=null ? x.avgMemo : x.avg;            // 암기 점수가 있으면 그것을 기준으로 판정
    x.level = x.key<LOW_BELOW ? "low" : x.key<HIGH_FROM ? "mid" : "high";
    return x;
  });
}

// 발음/인식 문제: 읽기 단계 시도들에서 반복해서 인식되지 않은 구절, 자주 다르게 들린 말, 인식 신뢰도 낮은 질문
function pronStats(){
  const readAtts={}, lowByQ={}, pairs={};
  S.done.forEach(d=>d.results.forEach(r=>{
    (r.atts||[]).forEach(a=>{
      const l=(lowByQ[r.id]=lowByQ[r.id]||{n:0,low:0}); l.n++; if(a.low&&a.low.length) l.low++;
      if(d.phase==="read"){ const e=(readAtts[r.id]=readAtts[r.id]||{script:r.script,list:[]}); e.script=r.script; e.list.push(a); }
    });
  }));
  const phrases=[];
  Object.keys(readAtts).forEach(id=>{
    const {script,list}=readAtts[id], n=list.length, cnt=new Array(script.length).fill(0);
    list.forEach(a=>(a.bad||[]).forEach(i=>{ if(i<cnt.length) cnt[i]++; }));
    const thr = n>=2 ? Math.max(2,Math.ceil(n*0.5)) : 1;
    let run="", minHit=0;
    // 구두점(、。)에서 끊고, 20자를 넘는 긴 덩어리는 '발음'이 아니라 건너뛰었거나 끝까지 읽지 않은 부분으로 보고 제외
    const flush=()=>{ const L=run.length; if(L>=2 && L<=20) phrases.push({id:+id, text:run, hits:minHit, n}); run=""; minHit=0; };
    for(let i=0;i<script.length;i++){
      const ch=script[i], isL=/[\p{L}\p{N}]/u.test(ch);
      if(isL){ if(cnt[i]>=thr){ run+=ch; minHit=minHit?Math.min(minHit,cnt[i]):cnt[i]; } else flush(); }
      else flush();
    }
    flush();
    list.forEach(a=>(a.ops||[]).forEach(o=>{
      if(o.t==="sub" && o.s.length<=8 && o.h.length<=8){ const k=o.s+"→"+o.h; const p=(pairs[k]=pairs[k]||{s:o.s,h:o.h,c:0,ids:new Set()}); p.c++; p.ids.add(+id); }
    }));
  });
  phrases.sort((a,b)=>b.hits-a.hits || b.hits/b.n-a.hits/a.n);
  const pairList=Object.values(pairs).sort((a,b)=>b.c-a.c).filter((p,i)=>p.c>=2||i<5).slice(0,8).map(p=>({...p,ids:[...p.ids].sort((a,b)=>a-b)}));
  const lowQ=Object.keys(lowByQ).map(id=>({id:+id, ...lowByQ[id], rate:lowByQ[id].low/lowByQ[id].n})).filter(x=>x.low>0&&x.rate>=0.4).sort((a,b)=>b.rate-a.rate||b.low-a.low).slice(0,6);
  return {phrases:phrases.slice(0,12), pairs:pairList, lowQ};
}
function buildReport(){
  const all=qStats(), by=a=>a.slice().sort((x,y)=>x.key-y.key);
  return {qs:all, low:by(all.filter(x=>x.level==="low")), mid:by(all.filter(x=>x.level==="mid")), high:by(all.filter(x=>x.level==="high")).reverse(),
          pron:pronStats(), lg:lastGate(), finished:S.done.length>=total()};
}
function gateText(g){
  if(!g) return "진행 중 (최종 관문: "+BASE_TOTAL+"회차 평균 "+GATE_SCORE+"점)";
  if(g.passed) return BASE_TOTAL+"회차 관문 통과 — 평균 "+g.avg+"점 (기준 "+GATE_SCORE+"점)";
  if(g.added) return BASE_TOTAL+"회차 평균 "+g.avg+"점으로 기준("+GATE_SCORE+"점) 미달 → 6~10회 재도전 진행";
  return "⚠ 재도전 후에도 평균 "+g.avg+"점으로 기준("+GATE_SCORE+"점) 미달 — 리포트 우선 제출";
}

  sec("보통 질문 — "+LOW_BELOW+"~"+(HIGH_FROM-1)+"점", R.mid, true);
  L.push(""); L.push("■ 우수 질문 — "+HIGH_FROM+"점 이상 ("+R.high.length+"개)");

  R.high.forEach(x=>L.push(" - Q"+x.id+" "+sumQ(qById(x.id))+" — 평균 "+x.key+"점 · 출제 "+x.n+"회"));
  L.push(""); L.push("■ 발음·인식 집중 교정 (음성인식 기반 추정 — 참고용, 신뢰도 약 50%)");
  const P=R.pron;
  L.push(" 1) 반복해서 인식되지 않은 구절 (대본을 읽을 때)");
  if(!P.phrases.length) L.push("    - 뚜렷한 반복 구절 없음");
  P.phrases.forEach(p=>L.push("    - Q"+p.id+" 「"+p.text+"」 — "+p.n+"회 중 "+p.hits+"회 인식 안 됨"));
  L.push(" 2) 자주 다르게 들린 말 (대본 → 인식)");
  if(!P.pairs.length) L.push("    - 해당 없음");
  P.pairs.forEach(p=>L.push("    - 「"+p.s+"」 → 「"+p.h+"」 "+p.c+"회 (Q"+p.ids.join(", Q")+")"));
  L.push(" 3) 인식 신뢰도가 자주 낮았던 질문 (발음이 또렷하지 않았을 가능성)");
  if(!P.lowQ.length) L.push("    - 해당 없음");
  P.lowQ.forEach(x=>L.push("    - Q"+x.id+" "+sumQ(qById(x.id))+" — "+x.n+"회 중 "+x.low+"회"));
  L.push("    ※ 음성인식 결과라 발음이 맞아도 표시될 수 있어요. 실제 발음은 모의면접에서 직접 확인해 주세요.");
  L.push(""); L.push("■ 질문별 전체 현황 (질문 요약 / 답변 요약)");
  R.qs.slice().sort((a,b)=>a.id-b.id).forEach(x=>{ const q=qById(x.id);
    L.push(" Q"+x.id+" ["+(x.level==="low"?"취약":x.level==="mid"?"보통":"우수")+" "+x.key+"점·"+x.n+"회] "+sumQ(q));
    L.push("     → "+sumA(q)); });
  return L.join("\n");
}

function download(name, text){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
}
async function copy(text, btn){
  try{ await navigator.clipboard.writeText(text); }catch(e){
    const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand("copy");}catch(_){} t.remove(); }
  if(btn){ const o=btn.textContent; btn.textContent="복사됨 ✓"; setTimeout(()=>btn.textContent=o,1500); }
}

      +'<div class="small muted" style="margin-top:6px">말이 약 '+Math.round((memo?SILENCE_MS:SILENCE_MS+2000)/1000)+'초 끊기면, 또는 삐 소리 뒤 '+Math.round(NOSPEECH_MS/1000)+'초 동안 말이 없으면 자동으로 끝나요.</div>';

      +'<div class="grow"><span class="badge '+(ok?"ok":"ng")+'">'+(ok?"통과!":"조금 더 연습해요")+'</span><div style="margin-top:6px" class="muted">'+(ok?"잘 읽었어요. 빨간 부분이 있다면 한 번 더 확인해 보세요.":"빨간 표시 부분을 고쳐서 다시 읽어 보세요. (통과 "+cur.pass+"점)")+'</div></div></div>';

}
function feedbackBlock(a){
  let h="";
  if(a.fast) h+='<div class="notice" style="margin-bottom:10px">⚡ 말이 빠른 편이에요(초당 약 '+a.rate+'자). 빠르게 이어 말하면 음성인식이 따라오지 못해 단어가 빠질 수 있어요. 문장이 끝날 때마다 한 박자 쉬면서 또박또박 말해 보세요. <span class="small">(참고용 추정)</span></div>';
  if(a.ops.length){
    h+='<div style="margin-top:8px"><b>대본과 달랐던 부분</b><ul class="diff">'+a.ops.map(o=>
      o.t==="miss"?'<li><span class="tag miss">빠짐</span>「'+esc(o.s)+'」'
      :o.t==="sub"?'<li><span class="tag sub">다르게 들림</span>대본 「'+esc(o.s)+'」 → 인식 「'+esc(o.h)+'」'
      :'<li><span class="tag extra">추가</span>대본에 없는 말 「'+esc(o.h)+'」').join("")+'</ul></div>';
  } else h+='<div class="ok-box">대본과 완전히 일치했어요!</div>';
  if(a.low&&a.low.length) h+='<div style="margin-top:8px"><b>발음이 또렷하지 않게 들린 구간</b> <span class="small muted">(인식 신뢰도 낮음)</span><ul class="diff">'+a.low.map(t=>'<li>「'+esc(t)+'」</li>').join("")+'</ul></div>';
  h+='<div class="small muted">※ 음성인식 기준이라 발음이 맞아도 표시될 수 있어요. 헷갈리면 선생님께 확인하세요.</div>';
  return h;
}

function reportCard(r,i){
  const ok=r.pass;
  let inner='<div class="small muted" style="margin:8px 0 4px">내 답변(인식 결과)</div><div class="script" style="font-size:16px;line-height:1.8">'+esc(r.heard||'(무응답)')+'</div>'
    +'<div class="small muted" style="margin:10px 0 4px">대본'+(r.bad&&r.bad.length?' (빨간색 = 인식 안 됨/다르게 말한 부분)':'')+'</div><div class="script" style="font-size:16px;line-height:1.8">'+scriptHtml(r.script,r.bad)+'</div>';
  if(r.kw&&r.kw.length&&(r.missKw||r.hitKw)) inner+='<div style="margin-top:10px"><b>핵심어</b> '+(r.hitKw||[]).map(k=>'<span class="chip hit">'+esc(k)+'</span>').join("")+(r.missKw||[]).map(k=>'<span class="chip miss">'+esc(k)+' ✕</span>').join("")+'</div>';
  inner+=feedbackBlock(r);
  return '<details '+(!ok?'open':'')+'><summary><span class="badge '+(ok?"ok":"ng")+'">'+r.score+'점</span> Q'+r.id+'. '+esc(r.q)
    +(r.tries>1?' <span class="muted small">('+r.tries+'회 시도)</span>':'')+(r.hints?' <span class="muted small">(힌트 '+r.hints+')</span>':'')+(r.replays?' <span class="muted small">(질문 다시 듣기 '+r.replays+')</span>':'')+'</summary>'+inner+'</details>';
}

    +d.results.slice().sort((a,b)=>a.pass-b.pass||a.score-b.score).map(reportCard).join("");

}

/* ===== 접근코드 (학생별) ===== */
function gHash(str){ let h1=0xdeadbeef,h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (4294967296*(2097151&h2)+(h1>>>0)).toString(16); }
function gNorm(x){ return String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
const GATE_KEY="mensetsuGate:"+C.student+":"+C.school;
let gateOk = !C.gate; let gateErr="";
try{ if(C.gate && localStorage.getItem(GATE_KEY)===C.gate.hash) gateOk=true; }catch(e){}
function viewGate(){
  return '<div class="card" style="max-width:460px;margin:60px auto"><h2>'+esc(C.student)+' 학생 전용 면접 훈련</h2><p class="muted">선생님께 받은 <b>접근코드</b>를 입력해 주세요.</p>'
   +'<input id="gate-code" type="text" autocomplete="off" autocapitalize="characters" placeholder="예) K7M2-9QX4" style="width:100%;font-size:20px;letter-spacing:2px;padding:10px;margin-top:8px">'
   +(gateErr?'<div class="notice" style="margin-top:10px">'+esc(gateErr)+'</div>':'')
   +'<div class="row" style="margin-top:14px"><button class="btn primary big" data-act="gate-submit">입장</button></div></div>';
}
function render(){
  const app=$("#app");
  if(!gateOk){ app.innerHTML=viewGate(); return; }
  app.innerHTML = view==="diag"&&diag?viewDiag() : view==="setup"?viewSetup() : view==="session"&&S.cur?viewSession() : view==="report"?viewReport(reportN) : view==="complete"?viewComplete() : viewDash();
  window.scrollTo(0,0);
}
function syncBtns(){ const b=$("#btn-rec"); if(b) b.disabled=ttsBusy; const l=$("#live"); if(l&&!win&&qs.mode==="ready") l.textContent=ttsBusy?"면접관이 질문하는 중이에요…":"준비되면 녹음 버튼을 누르세요."; }

/* ===== 이벤트 ===== */
document.addEventListener("change",e=>{ if(e.target.id==="tts"){ ttsOn=e.target.checked; if(!ttsOn) stopSpeak(); } });
document.addEventListener("change",e=>{ if(e.target&&e.target.id==="f-voice"){ S.profile.voice=e.target.value; save(); } });
try{ speechSynthesis.onvoiceschanged=()=>{ if(view==="setup"&&!(micTest&&micTest.on)) render(); }; }catch(e){}
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target&&e.target.id==="gate-code"){ const b=document.querySelector('[data-act="gate-submit"]'); if(b) b.click(); } });
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act;
  if(act==="gate-submit"){
    const v=gNorm(($("#gate-code")||{}).value);
    if(C.gate && gHash(C.gate.salt+v)===C.gate.hash){ gateOk=true; gateErr=""; try{ localStorage.setItem(GATE_KEY,C.gate.hash); }catch(e){} render(); }
    else { gateErr="코드가 맞지 않아요. 선생님께 받은 코드를 다시 확인해 주세요."; render(); const i=$("#gate-code"); if(i) i.focus(); }
    return;
  }
  if(act==="start"){ startSession(); }
  else if(act==="go-dash"){ flowId++; stopSpeak(); disarmMic(); view="dash"; render(); }
  else if(act==="pause"){ flowId++; stopSpeak(); abortRec(); disarmMic(); view="dash"; render(); }
  else if(act==="setup"){ view="setup"; render(); }
  else if(act==="setup-save"){
    const g=$("#f-grade"), o=$("#f-other");
    if(g) S.profile.grade=g.value; if(o) S.profile.other=o.value.trim();
    if(!setupOk()){ setupErr="빠진 항목이 있어요. ("+(needsGrade?"학년 선택 / ":"")+"직접 쓰는 답변(Q"+((C.questions.find(q=>q.type==="custom")||{}).id||"")+")은 8자 이상)"; render(); return; }
    setupErr=""; save(); view="dash"; render();
  }
  else if(act==="diag"){ unlockAudio(); runDiag(); }
  else if(act==="diag-back"){ view=(prevView==="session"&&S.cur)?"session":"dash"; render(); }
  else if(act==="voice-test"){ unlockAudio(); const f=$("#f-voice"); if(f){ S.profile.voice=f.value; save(); } speakAsync("こんにちは。面接を始めます。まず、自己紹介をお願いします。"); }
  else if(act==="mic-reset"){
    if(["ask","prep","beep","rec"].includes(qs.mode)){ flowId++; stopSpeak(); abortRec(); qs.mode="ready"; qs.err=""; }
    micNote="마이크를 다시 연결하는 중… (허용 창이 뜨면 '허용')"; render();
    reopenMic().then(ok=>{ micNote= ok ? "✔ 마이크를 다시 인식했어요: "+(micName||"기본 마이크")+" — 말해 보면 오른쪽 막대가 움직여요. 준비되면 ▶를 누르세요." : micAdvice(lastMicErr&&lastMicErr.name); render(); });
  }
  else if(act==="mic-test"){
    if(micTest&&micTest.on){ stopRec(); return; }
    micTest={on:true,text:"준비 중… (허용 창이 뜨면 '허용')"}; render();
    armMic().then(async ok=>{
      if(!ok){ micTest={on:false,text:micAdvice(lastMicErr&&lastMicErr.name)}; render(); return; }
      const live=await freshEngine();
      if(!live){ micTest={on:false,text:engErr||micAdvice('network')}; disarmMic(); render(); return; }
      micTest={on:true,text:"삐 소리 뒤에 말해 보세요 (6초)"}; render();
      await beep();
      startRec(r=>{ micTest={on:false,text:r.err||(r.text?"✔ 인식 결과: "+r.text:"소리가 인식되지 않았어요. 마이크 음량을 확인해 주세요.")}; disarmMic(); render(); },{autoStop:false});
      setTimeout(()=>stopRec(),6000);
    });
  }
  else if(act==="greet-next"){ stopSpeak(); S.cur.greeted=true; save(); qs=freshQs(); render(); if(S.cur.phase==="memo") askAndRecord(curQ()); }
  else if(act==="replay"){ speakAsync(C.greeting); }
  else if(act==="replay-q"){ speakAsync(curQ().q); }
  else if(act==="play"){ askAndRecord(curQ()); }
  else if(act==="replay-mid"){
    if(qs.replays<1){ qs.replays++; flowId++; abortRec(); stopSpeak(); askAndRecord(curQ()); }
  }
  else if(act==="rec-stop"){ stopRec(); const l=$("#live"); if(l) l.textContent="처리 중…"; }
  else if(act==="type-submit"){
    const v=($("#typed")||{}).value||""; qs.typed=true;
    onAnswer(curQ(),{text:v.trim(),low:[],dur:Math.max(5,v.length/4),err:""});
  }
  else if(act==="retry"){ qs={...freshQs(),typed:qs.typed}; askAndRecord(curQ(),{tts:false}); }
  else if(act==="next"){ nextQuestion(); }
  else if(act==="open-report"){ reportN=+t.dataset.n; view="report"; render(); }
  else if(act==="open-complete"){ view="complete"; render(); }
  else if(act==="copy-msg"){ copy(teacherMsg(), t); }
  else if(act==="copy-report"){ copy(reportText(), t); }
  else if(act==="dl-report"){ download("면접훈련리포트_"+C.student+".txt", reportText()); }
  else if(act==="reset-ask"){ resetAsk=true; render(); }
  else if(act==="reset-no"){ resetAsk=false; render(); }
  else if(act==="reset-do"){ S={profile:S.profile,done:[],cur:null,extra:0}; save(); resetAsk=false; render(); }
});
if("speechSynthesis" in window) speechSynthesis.getVoices();
view = "dash";
render();
</script>
